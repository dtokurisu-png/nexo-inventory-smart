/* Unified Nexo application header · workspace logic */
.topbar{
  height:calc(var(--header) + env(safe-area-inset-top));
  gap:14px;
  background:rgba(6,9,14,.94);
  border-bottom:1px solid rgba(255,255,255,.08);
  box-shadow:0 10px 30px rgba(0,0,0,.28);
  backdrop-filter:blur(20px) saturate(118%);
}
.brand{gap:10px;min-width:180px}
.mark{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(145deg,#f1d98e,#a87c2f);
  color:#17130c;border:1px solid rgba(255,231,170,.34);
  box-shadow:0 8px 22px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.44);

.nexoNav{display:flex;align-self:stretch;align-items:stretch;gap:16px;min-width:0}
.nexoNavLink{
  position:relative;border:0;background:transparent;color:#9ca6b7;padding:0 2px;
  font:inherit;font-size:12px;font-weight:760;white-space:nowrap
}
.nexoNavLink:after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px 3px 0 0;background:transparent

.nexoNavLink:hover,.nexoNavLink:focus-visible{color:#f3f6fb;outline:none}

.timerField input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.42);color:var(--ink);padding:9px 11px;font:800 18px/1 Inter,system-ui;text-align:center;outline:none}
.timerField input:focus{border-color:#2f4f93;box-shadow:0 0 0 3px rgba(47,79,147,.12)}
.timerQuick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.timerQuick button{min-height:40px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.36);color:var(--ink);font-weight:850}
.timerList{display:grid;gap:9px}
.timerEmpty{padding:22px 12px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}
.timerItem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.315);backdrop-filter:blur(16px)}
.timerItem.ringing{border-color:#b94242;box-shadow:0 0 0 2px rgba(185,66,66,.13)}
.timerMain{display:grid;gap:3px;min-width:0}
.timerName{font-size:12px;font-weight:800;color:var(--muted)}
.timerTime{font-size:30px;line-height:1;font-weight:950;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--ink)}
.timerState{font-size:11px;color:var(--muted);font-weight:750}
.timerItem.ringing .timerTime,.timerItem.ringing .timerState{color:#b94242}
.timerActions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.timerActions button{min-height:36px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.40);color:var(--ink);font-weight:850}
.timerActions button.primaryTimer{background:#264c8f;color:#fff;border-color:#172755}
.timerActions button.stopAlarm{background:#b94242;color:#fff;border-color:#873131}
.timerAlarmHint{margin:0;color:var(--muted);font-size:11px;line-height:1.45}
html[data-theme="night"] .timerCreate,
html[data-theme="night"] .timerItem{background:rgba(16,22,33,.315);border-color:rgba(255,255,255,.10)}
html[data-theme="night"] .timerField input,
html[data-theme="night"] .timerQuick button,
html[data-theme="night"] .timerActions button{background:rgba(16,22,33,.27);color:#f2f5fa;border-color:rgba(255,255,255,.10)}
html[data-theme="night"] .timerField span,
html[data-theme="night"] .timerName,
html[data-theme="night"] .timerState,
html[data-theme="night"] .timerAlarmHint{color:#a8b2c3}
html[data-theme="night"] .timerTime{color:#f2f5fa}
html.nexoMobile .timerTime{font-size:22px}
html.nexoMobile .timerField input{min-height:38px;font-size:16px}
html.nexoMobile .timerQuick button{min-height:34px;font-size:12px}
html.nexoMobile .timerActions button{min-height:32px;font-size:11px;padding:6px 8px}
@media(max-width:520px){.timerItem{grid-template-columns:1fr}.timerActions{justify-content:flex-start}}
</style>

function removeKitchenTimer(id){const i=T.items.findIndex(t=>t.id===id);if(i<0)return;T.items.splice(i,1);syncAlarmState();showCalc(!!S.route.length);timerPaint()}
function acknowledgeKitchenTimer(id){const x=T.items.find(t=>t.id===id);if(!x)return;x.due=false;x.done=true;x.running=false;x.remaining=0;syncAlarmState();timerPaint()}
function timerTick(){const now=Date.now();let fired=false;for(const x of T.items){if(x.running&&x.endAt<=now){x.running=false;x.remaining=0;x.done=true;x.due=true;fired=true}}if(fired){ringTimerAlarm();toast(S.lang==='es'?'⏱ Temporizador terminado · abre Temporizadores para detener la alarma':'⏱ Timer finished · open Timers to stop the alarm',6000)}if(S.modal?.kind==='timers')timerPaint()}
function timerPaint(){const zone=document.getElementById('timerList');if(!zone)return;const es=S.lang==='es';if(!T.items.length){zone.innerHTML='<div class="timerEmpty">'+(es?'No hay temporizadores activos.':'No active timers.')+'</div>';return}zone.innerHTML=T.items.map((x,i)=>{const rem=timerRemaining(x),state=x.due?(es?'ALARMA SONANDO':'ALARM RINGING'):x.running?(es?'En marcha':'Running'):x.done?(es?'Finalizado':'Finished'):(es?'Pausado':'Paused');return '<article class="timerItem '+(x.due?'ringing':'')+'"><div class="timerMain"><span class="timerName">'+(es?'Temporizador ':'Timer ')+(i+1)+'</span><strong class="timerTime">'+timerFmt(rem)+'</strong><span class="timerState">'+state+'</span></div><div class="timerActions">'+(x.due?'<button class="stopAlarm" data-timer-ack="'+x.id+'">'+(es?'Detener alarma':'Stop alarm')+'</button>':x.running?'<button data-timer-pause="'+x.id+'">'+(es?'Pausar':'Pause')+'</button>':'<button class="primaryTimer" data-timer-start="'+x.id+'">'+(x.done?(es?'Reiniciar':'Restart'):(es?'Continuar':'Resume'))+'</button>')+'<button data-timer-reset="'+x.id+'">'+(es?'Reset':'Reset')+'</button><button data-timer-remove="'+x.id+'">'+(es?'Eliminar':'Delete')+'</button></div></article>'}).join('');zone.querySelectorAll('[data-timer-start]').forEach(b=>b.onclick=()=>startKitchenTimer(b.dataset.timerStart));zone.querySelectorAll('[data-timer-pause]').forEach(b=>b.onclick=()=>pauseKitchenTimer(b.dataset.timerPause));zone.querySelectorAll('[data-timer-reset]').forEach(b=>b.onclick=()=>resetKitchenTimer(b.dataset.timerReset));zone.querySelectorAll('[data-timer-remove]').forEach(b=>b.onclick=()=>removeKitchenTimer(b.dataset.timerRemove));zone.querySelectorAll('[data-timer-ack]').forEach(b=>b.onclick=()=>acknowledgeKitchenTimer(b.dataset.timerAck))}
function renderTimers(){const es=S.lang==='es',body='<div class="timerWrap"><div class="timerCreate"><div class="timerFields"><label class="timerField"><span>'+(es?'Minutos':'Minutes')+'</span><input id="timerMinutes" type="number" min="0" max="999" inputmode="numeric" value="5"></label><label class="timerField"><span>'+(es?'Segundos':'Seconds')+'</span><input id="timerSeconds" type="number" min="0" max="59" inputmode="numeric" value="0"></label></div><button id="timerAdd" class="primary">'+(es?'Iniciar temporizador':'Start timer')+'</button><div class="timerQuick"><button data-timer-quick="60">1 min</button><button data-timer-quick="300">5 min</button><button data-timer-quick="600">10 min</button><button data-timer-quick="900">15 min</button></div><p class="timerAlarmHint">'+(es?'Al finalizar sonará la alarma suministrada hasta que la detengas. Los temporizadores continúan aunque cierres esta ventana.':'When finished, the supplied alarm will loop until you stop it. Timers continue if you close this window.')+'</p></div><div id="timerList" class="timerList"></div></div>';shell(es?'Temporizadores':'Timers',body);document.getElementById('timerAdd').onclick=()=>{const m=Math.max(0,Number(document.getElementById('timerMinutes')?.value||0)),s=Math.max(0,Math.min(59,Number(document.getElementById('timerSeconds')?.value||0))),ms=(m*60+s)*1000;if(ms<1000){toast(es?'Indica al menos 1 segundo.':'Enter at least 1 second.');return}addKitchenTimer(ms)};modal.querySelectorAll('[data-timer-quick]').forEach(b=>b.onclick=()=>addKitchenTimer(Number(b.dataset.timerQuick)*1000));timerPaint()}
function calcNum(){return Number(String(C.display).replace(',','.'))}function calcFmt(n){if(!Number.isFinite(n))return'Error';const a=Math.abs(n);if(a!==0&&(a>=1e12||a<1e-8))return n.toExponential(6);return String(Number(n.toFixed(10)))}function calcApply(a,b,op){if(op==='+')return a+b;if(op==='−')return a-b;if(op==='×')return a*b;if(op==='÷')return b===0?NaN:a/b;return b}function calcPaint(){const d=$('#calcDisplay'),e=$('#calcExpr');if(d)d.textContent=C.display;if(e)e.textContent=C.expr||' '}function calcDigit(v){if(C.display==='Error'){C.display='0';C.acc=null;C.op=null;C.expr='';C.fresh=true}if(C.fresh){C.display=v==='.'?'0.':v;C.fresh=false}else if(v==='.'||v===','){if(!C.display.includes('.')&&!C.display.includes(','))C.display+='.'}else if(C.display.replace(/[-.,]/g,'').length<12)C.display+=v;calcPaint()}function calcOperator(op){let cur=calcNum();if(!Number.isFinite(cur)){calcClear();return}if(C.op&&C.acc!==null&&!C.fresh){cur=calcApply(C.acc,cur,C.op);C.display=calcFmt(cur)}C.acc=cur;C.op=op;C.expr=`${C.display} ${op}`;C.fresh=true;calcPaint()}function calcPercent(){let cur=calcNum();if(!Number.isFinite(cur))return;if(C.acc!==null&&C.op&&(C.op==='+'||C.op==='−'))cur=C.acc*cur/100;else cur=cur/100;C.display=calcFmt(cur);C.fresh=true;calcPaint()}function calcEquals(){if(C.acc===null||!C.op)return;const b=calcNum(),a=C.acc,op=C.op,r=calcApply(a,b,op);C.expr=`${calcFmt(a)} ${op} ${calcFmt(b)} =`;C.display=calcFmt(r);C.acc=null;C.op=null;C.fresh=true;calcPaint()}function calcClear(){C.display='0';C.acc=null;C.op=null;C.expr='';C.fresh=true;calcPaint()}function calcBack(){if(C.fresh||C.display==='Error')return;C.display=C.display.length>1?C.display.slice(0,-1):'0';if(C.display==='-'||C.display==='')C.display='0';calcPaint()}function renderCalculator(){const body=`<div class="calcWrap"><div class="calcScreen"><div id="calcExpr" class="calcExpr"></div><div id="calcDisplay" class="calcDisplay">0</div></div><div class="calcGrid"><button class="calcKey ac" data-calc="ac">AC</button><button class="calcKey" data-calc="back">⌫</button><button class="calcKey op" data-calc="%">%</button><button class="calcKey op" data-calc="÷">÷</button><button class="calcKey" data-calc="7">7</button><button class="calcKey" data-calc="8">8</button><button class="calcKey" data-calc="9">9</button><button class="calcKey op" data-calc="×">×</button><button class="calcKey" data-calc="4">4</button><button class="calcKey" data-calc="5">5</button><button class="calcKey" data-calc="6">6</button><button class="calcKey op" data-calc="−">−</button><button class="calcKey" data-calc="1">1</button><button class="calcKey" data-calc="2">2</button><button class="calcKey" data-calc="3">3</button><button class="calcKey op" data-calc="+">+</button><button class="calcKey" data-calc="0">0</button><button class="calcKey" data-calc=".">.</button><button class="calcKey eq" data-calc="=">=</button></div><p class="calcHint">${esc(t('calcHint'))}</p></div>`;shell(t('calculator'),body);calcPaint();modal.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{const v=b.dataset.calc;if(/^\d$/.test(v)||v==='.')calcDigit(v);else if(['+','−','×','÷'].includes(v))calcOperator(v);else if(v==='%')calcPercent();else if(v==='=')calcEquals();else if(v==='ac')calcClear();else if(v==='back')calcBack()})}
function renderCommentModal(){const r=S.recipes.find(x=>x._id===S.modal?.recipeId);if(!r){closeModal();return}const body=`<p class="modalText">${esc(t('commentHint'))}</p><textarea id="commentText" class="commentText" maxlength="2000" placeholder="${esc(t('commentPlaceholder'))}"></textarea><div id="commentError" class="commentError"></div><div class="modalActions"><button id="commentSave" class="primary">${esc(t('sendComment'))}</button><button id="commentCancel" class="secondary">${esc(t('close'))}</button></div>`;shell(t('commentTitle')+' · '+rname(r),body);const input=$('#commentText'),save=$('#commentSave');$('#commentCancel').onclick=closeModal;input?.focus();save.onclick=()=>{const comment=String(input?.value||'').trim();if(!comment){const err=$('#commentError');if(err)err.textContent=S.lang==='es'?'Escribe un comentario antes de enviarlo.':'Write a comment before sending.';return}const requestId='recipe-comment-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);S.modal.requestId=requestId;save.disabled=true;save.textContent=t('sendingComment');const err=$('#commentError');if(err)err.textContent='';send('NEXO_DM_RECIPE_COMMENT',{requestId,technicalSheetId:r._id,recipeTitle:rname(r),comment})}}
function renderModal(){if(!S.modal){modal.innerHTML='';back.classList.toggle('hidden',!S.route.length);return}back.classList.remove('hidden');if(S.modal.kind==='calculator')return renderCalculator();if(S.modal.kind==='timers')return renderTimers();if(S.modal.kind==='comment')return renderCommentModal();if(S.modal.kind==='legend')return renderLegend();if(S.modal.kind==='unit')return renderUnit();if(S.modal.kind==='subrecipe')return renderSubrecipeModal();return renderIngredientModal()}function shell(title,body){modal.innerHTML=`<div class="modalShade" id="shade"><div class="modal"><div class="modalHead"><h2>${esc(title)}</h2><button id="close" class="icon">×</button></div>${body}</div></div>`;$('#close').onclick=closeModal;$('#shade').onclick=e=>{if(e.target.id==='shade')closeModal()}}
function renderSubrecipeModal(){let c=S.components.find(x=>x._id===S.modal.componentId);if(!c){closeModal();return}let recipe=c.targetRecipeId?S.recipes.find(r=>r._id===c.targetRecipeId):null,name=txt(c,'displayEn','displayEs')||(recipe?rname(recipe):'—'),pending=!recipe;let body=`<span class="tag tagPrep">${esc(t('subrecipe'))}</span><h2 style="margin:4px 0 8px;color:var(--prep)">${esc(name)}</h2><p class="modalText">${esc(pending?t('pending'):(S.lang==='es'?'Esta preparación tiene su propia ficha técnica.':'This preparation has its own technical sheet.'))}</p><div class="modalActions">${recipe?`<button id="openRecipeBtn" class="primary">${esc(t('openRecipe'))}</button>`:''}<button id="modalCloseBtn" class="secondary">${esc(t('close'))}</button></div>`;shell(name,body);$('#modalCloseBtn').onclick=closeModal;if(recipe)$('#openRecipeBtn').onclick=()=>openRecipe(recipe._id)}
function renderIngredientModal(){let ing=S.ingredients.find(x=>x._id===S.modal.ingredientId);if(!ing){closeModal();return}let ps=S.preparations.filter(x=>x.ingredientId===ing._id),sel=ps.find(x=>x._id===S.modal.prepId)||null,bu=img(ing.baseImage),pu=img(sel?.image);let prepPicker=ps.length?`<div class="prepList">${ps.map(p=>`<button class="prep ${sel?._id===p._id?'active':''}" data-p="${esc(p._id)}">${esc(pname(p))}</button>`).join('')}</div>`:'';let photos=`<div class="photos">${photoBlock(t('whole'),iname(ing),bu,'ingredient',ing._id)}${sel?photoBlock(t('cut'),pname(sel),pu,'preparation',sel._id):''}</div>`;shell(iname(ing),prepPicker+photos);modal.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{S.modal.prepId=x.dataset.p;renderModal()})}
function photoBlock(title,name,url,type,id){return `<article class="photo"><div class="pic">${url?`<img src="${esc(url)}">`:`<span class="muted">${esc(t('noPhoto'))}</span>`}</div><div class="photoBody"><h3>${esc(title)}</h3><p>${esc(name)}</p><button class="${url?'secondary':'primary'}" data-photo-target data-photo-type="${type}" data-photo-id="${esc(id)}">${url?t('replace'):t('add')}</button></div></article>`}
function unitInfo(unit){let fam=unitFamily(unit)[1],es=S.lang==='es';let map={metricMass:es?'Masa métrica. g = gramos; kg = kilogramos. 1 kg = 1000 g.':'Metric mass. g = grams; kg = kilograms. 1 kg = 1000 g.',imperialMass:es?'Masa imperial. oz = onzas; lb = libras. 1 lb = 16 oz.':'Imperial mass. oz = ounces; lb = pounds. 1 lb = 16 oz.',metricVolume:es?'Volumen métrico. ml = mililitros; L = litros. 1 L = 1000 ml.':'Metric volume. ml = milliliters; L = liters. 1 L = 1000 ml.',count:es?'Conteo por pieza o unidad. Se usa cuando el ingrediente se cuenta, no se pesa.':'Piece or unit count. Used when an ingredient is counted rather than weighed.',spoon:es?'Medidas por cuchara.':'Spoon measures.',cup:es?'Medida por taza.':'Cup measure.',other:es?'Unidad especial o cantidad según necesidad.':'Special unit or quantity as needed.'};return map[fam]}
function renderUnit(){let u=S.modal.unit,f=unitFamily(u);shell(`${t('unit')}: ${u}`,`<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><span class="unitBtn ${f[0]}">${esc(u)}</span><strong>${esc(t('unit'))}</strong></div><p class="modalText">${esc(unitInfo(u))}</p>`)}
function renderLegend(){let es=S.lang==='es',rows=[['var(--dish)',t('dish'),es?'Ficha final que se sirve al cliente.':'Final dish served to the guest.'],['var(--prep)',t('prep'),es?'Subreceta o preparación reutilizable.':'Reusable preparation or subrecipe.'],['var(--product)',t('product'),es?'Ingrediente o producto base.':'Base ingredient or product.'],['var(--metricMass)','g / kg',es?'Masa métrica.':'Metric mass.'],['var(--imperialMass)','oz / lb',es?'Masa imperial.':'Imperial mass.'],['var(--metricVolume)','ml / L',es?'Volumen métrico.':'Metric volume.'],['var(--count)','ea / u',es?'Conteo por unidad.':'Count by unit.'],['var(--spoon)','tsp / tbsp',es?'Cucharas.':'Spoon measures.'],['var(--cup)','cup',es?'Tazas.':'Cup measures.']];shell(t('legend'),`<div class="legend">${rows.map(r=>`<div class="legendRow"><span class="swatch" style="background:${r[0]}"></span><div><b>${esc(r[1])}</b><small>${esc(r[2])}</small></div></div>`).join('')}</div>`)}
function applyPhoto(detail){if(!detail?.entityType||!detail.entityId||!detail.image)return;const {entityType,entityId,image}=detail;if(entityType==='recipe'){const r=S.recipes.find(x=>x._id===entityId);if(r)r.heroImage=image}else if(entityType==='ingredient'){const i=S.ingredients.find(x=>x._id===entityId);if(i)i.baseImage=image}else if(entityType==='preparation'){const p=S.preparations.find(x=>x._id===entityId);if(p)p.image=image}if(S.route.at(-1)?.id===entityId)render();if(S.modal)renderModal()}

addEventListener('message',e=>{let m=e.data;if(typeof m==='string')try{m=JSON.parse(m)}catch{return}if(!m?.type)return;let p=m.payload||{};if(m.type==='WIX_READY')send('LOAD_MENU_DATA');if(m.type==='MENU_DATA_LOADED'){Object.assign(S,{recipes:p.recipes||[],sections:p.sections||[],components:p.components||[],ingredients:p.ingredients||[],preparations:p.preparations||[],loaded:true});render()}if(m.type==='ERROR'&&p.message)toast(p.message,3000)});window.NEXO_MENU_API={openRecipe,render,home:()=>{S.route=[];S.modal=null;modal.innerHTML='';render()},getData:()=>S};setLang(S.lang);send('MENU_HTML_READY',{version:'4.2.1',adaptiveMobile:true,visualTaxonomy:true,photoSystem:'external-v1',timers:'uploaded-alarm-v1'});})();
