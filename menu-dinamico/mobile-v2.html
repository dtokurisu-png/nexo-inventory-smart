<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171511">
<title>Nexo Group · Menú Dinámico</title>
<style>
:root{--bg:#f5f1e9;--panel:#fffdfa;--ink:#191713;--muted:#766f64;--line:#ddd5c8;--accent:#8b5a2b;--header:64px;--radius:18px;--shadow:0 14px 42px rgba(25,20,14,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
body{overscroll-behavior-y:none}.app{min-height:100dvh;padding-top:calc(var(--header) + env(safe-area-inset-top))}.topbar{position:fixed;z-index:50;left:0;right:0;top:0;height:calc(var(--header) + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));display:flex;align-items:center;gap:9px;background:rgba(255,253,250,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.icon,.lang{height:42px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink)}.icon{width:42px}.lang{padding:0 11px;font-weight:800}.brand{min-width:0;display:flex;align-items:center;gap:9px;font-weight:900}.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:13px}.brandText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spacer{flex:1}
main{max-width:1080px;margin:0 auto;padding:22px 16px 72px}.title{margin:0 0 6px;font-size:clamp(30px,5vw,50px);line-height:1;letter-spacing:-.035em}.subtitle{margin:0 0 18px;color:var(--muted)}.search{width:100%;padding:13px 14px;border:1px solid var(--line);background:#fff;border-radius:14px;outline:none}.chips{display:flex;gap:8px;overflow:auto;padding:12px 0;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);overflow:hidden;box-shadow:0 7px 20px rgba(25,20,14,.05)}.recipeCard{width:100%;padding:0;text-align:left;color:inherit}.thumb{aspect-ratio:16/10;background:#e9e3d8;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.meta{padding:14px}.meta h3{margin:0;font-size:19px}.tag{display:inline-flex;margin-bottom:7px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.muted{color:var(--muted)}
.recipeView{animation:enter .2s ease-out}.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:13px;font-size:13px;color:var(--muted)}.crumbs button{border:0;background:none;color:var(--accent);padding:0;font-weight:800}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}.heroImage{min-height:280px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#e9e3d8;display:grid;place-items:center}.heroImage img{width:100%;height:100%;max-height:520px;object-fit:cover}.heroText h1{font-size:clamp(34px,6vw,58px);letter-spacing:-.045em;line-height:.98;margin:5px 0 10px}.yield{display:inline-flex;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:13px}
.sections{display:grid;gap:16px;margin-top:22px}.section{padding:17px;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius)}.section h2{margin:0 0 10px;font-size:20px}.row{width:100%;display:grid;grid-template-columns:minmax(90px,125px) 1fr auto;gap:10px;align-items:center;text-align:left;padding:13px 3px;border:0;border-bottom:1px solid #ece6dc;background:transparent;color:inherit}.row:last-child{border-bottom:0}.qty{font-weight:850;font-variant-numeric:tabular-nums}.name{font-weight:740}.note{display:block;font-size:12px;color:var(--muted);margin-top:2px}.chev{font-size:23px;color:var(--accent)}.mop{white-space:pre-wrap;line-height:1.62}
.modalShade{position:fixed;z-index:100;inset:0;background:rgba(16,14,10,.64);display:flex;justify-content:center;align-items:flex-end}.modal{width:min(720px,100%);max-height:92dvh;overflow:auto;background:var(--panel);border-radius:24px 24px 0 0;padding:14px 16px max(22px,env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.22)}.modalHead{position:sticky;top:-14px;z-index:2;display:flex;align-items:center;gap:8px;margin:-14px -16px 12px;padding:11px 16px;background:rgba(255,253,250,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.modalHead h2{margin:0;flex:1;font-size:18px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}.photo{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff}.pic{aspect-ratio:4/3;background:#ece6db;display:grid;place-items:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.photoBody{padding:12px}.photoBody h3{margin:0 0 5px;font-size:14px}.primary,.secondary{border-radius:12px;padding:10px 12px;font-weight:850}.primary{border:1px solid var(--ink);background:var(--ink);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.prepList{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.prep{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px}.prep.active{border-color:var(--accent);color:var(--accent);font-weight:850}
.status{position:fixed;z-index:120;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:92vw;padding:10px 13px;border-radius:12px;background:#1d1a16;color:#fff;box-shadow:var(--shadow);font-size:13px}.empty{padding:32px 18px;border:1px dashed #ccc1b1;border-radius:var(--radius);text-align:center;color:var(--muted)}@keyframes enter{from{opacity:.25;transform:translateX(12px)}to{opacity:1;transform:none}}
@media(max-width:720px){:root{--header:58px;--radius:0}html,body{background:var(--panel)}.app{min-height:100dvh}.brandText{max-width:125px}.mark{display:none}.topbar{background:rgba(255,253,250,.985)}main{max-width:none;padding:0 0 max(60px,env(safe-area-inset-bottom))}.homeView{padding:16px 12px 24px}.title{font-size:31px}.subtitle{font-size:14px}.grid{grid-template-columns:1fr;gap:10px}.recipeCard{display:grid;grid-template-columns:105px 1fr;min-height:92px;border-radius:15px;box-shadow:none}.thumb{aspect-ratio:auto;height:100%;min-height:92px}.meta{display:flex;flex-direction:column;justify-content:center;padding:11px 12px}.meta h3{font-size:17px}.recipeView{position:relative;min-height:calc(100dvh - var(--header) - env(safe-area-inset-top));background:var(--panel);padding:0 0 26px}.crumbs{display:none}.hero{display:flex;flex-direction:column;gap:0}.heroText{order:-1;padding:16px 14px 12px;border-bottom:1px solid var(--line)}.heroText h1{font-size:33px;margin:3px 0 9px}.heroImage{width:100%;min-height:0;aspect-ratio:16/9;border:0;border-radius:0}.heroImage img{max-height:none}.sections{margin:0;gap:0}.section{padding:15px 14px;border:0;border-bottom:8px solid var(--bg);border-radius:0}.section h2{font-size:18px}.row{grid-template-columns:78px 1fr auto;padding:14px 1px;min-height:52px}.qty{font-size:14px}.name{font-size:15px}.modalShade{align-items:stretch}.modal{width:100%;height:100dvh;max-height:none;border-radius:0;padding-top:calc(12px + env(safe-area-inset-top))}.modalHead{top:calc(-12px - env(safe-area-inset-top));margin-top:calc(-12px - env(safe-area-inset-top));padding-top:calc(10px + env(safe-area-inset-top))}.photos{grid-template-columns:1fr}.pic{aspect-ratio:16/10}.status{bottom:max(12px,env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div class="app"><header class="topbar"><button id="back" class="icon hidden">←</button><div class="brand"><div class="mark">NG</div><div class="brandText">Menú Dinámico</div></div><div class="spacer"></div><button id="home" class="icon">⌂</button><button id="lang" class="lang">ES</button></header><main id="view"></main></div><div id="modal"></div><div id="status" class="status hidden"></div>
<script>
(()=>{'use strict';
const I={es:{library:'Recetario dinámico',sub:'Fichas técnicas, preparaciones e ingredientes conectados.',search:'Buscar receta o preparación…',all:'Todo',dish:'Platos',prep:'Preparaciones',yield:'Rendimiento',method:'Método / MOP',noPhoto:'Sin foto',whole:'Producto entero / base',cut:'Preparación / corte',add:'Agregar foto',replace:'Cambiar foto',noCut:'Sin corte específico',empty:'Todavía no hay recetas cargadas',waiting:'Esperando conexión con Wix…'},en:{library:'Dynamic recipe book',sub:'Connected technical sheets, preparations, and ingredients.',search:'Search recipe or preparation…',all:'All',dish:'Dishes',prep:'Preparations',yield:'Yield',method:'Method / MOP',noPhoto:'No photo',whole:'Whole / base product',cut:'Preparation / cut',add:'Add photo',replace:'Replace photo',noCut:'No specific cut',empty:'No recipes have been added yet',waiting:'Waiting for Wix connection…'}};
const S={lang:localStorage.getItem('nexo_dynamic_menu_lang')||'es',recipes:[],sections:[],components:[],ingredients:[],preparations:[],route:[],filter:'ALL',query:'',loaded:false,modal:null,pending:new Map()};const $=q=>document.querySelector(q),view=$('#view'),modal=$('#modal'),back=$('#back'),lang=$('#lang'),status=$('#status');const t=k=>I[S.lang][k]||k,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),txt=(o,a,b)=>S.lang==='es'?(o?.[b]||o?.[a]||''):(o?.[a]||o?.[b]||''),rname=r=>txt(r,'titleEn','titleEs')||'—',iname=x=>txt(x,'nameEn','nameEs')||'—',pname=x=>txt(x,'nameEn','nameEs')||'—',img=x=>x&&(x.url||x.image?.url||x.src)||'';const send=(type,payload={})=>parent.postMessage({type,payload},'*');
function toast(m,ms=2200){status.textContent=m;status.classList.remove('hidden');clearTimeout(toast.x);toast.x=setTimeout(()=>status.classList.add('hidden'),ms)}function setLang(v){S.lang=v;localStorage.setItem('nexo_dynamic_menu_lang',v);lang.textContent=v.toUpperCase();document.documentElement.lang=v;render();if(S.modal)renderModal()}lang.onclick=()=>setLang(S.lang==='es'?'en':'es');$('#home').onclick=()=>{S.route=[];S.modal=null;modal.innerHTML='';render()};back.onclick=()=>{if(S.modal){S.modal=null;renderModal()}else if(S.route.length){S.route.pop();render();scrollTo(0,0)}};
function render(){lang.textContent=S.lang.toUpperCase();back.classList.toggle('hidden',!S.route.length&&!S.modal);if(!S.loaded){view.innerHTML=`<div class="homeView"><div class="empty">${esc(t('waiting'))}</div></div>`;return}const cur=S.route.at(-1);cur?renderRecipe(cur.id):renderHome()}
function renderHome(){let list=S.recipes.filter(r=>r.active!==false),q=S.query.trim().toLowerCase();if(S.filter==='DISH')list=list.filter(r=>String(r.recipeType).toUpperCase()==='DISH');if(S.filter==='SUBRECIPE')list=list.filter(r=>String(r.recipeType).toUpperCase()!=='DISH');if(q)list=list.filter(r=>[r.titleEn,r.titleEs,r.category].some(v=>String(v||'').toLowerCase().includes(q)));list.sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));view.innerHTML=`<div class="homeView"><h1 class="title">${esc(t('library'))}</h1><p class="subtitle">${esc(t('sub'))}</p><input id="q" class="search" placeholder="${esc(t('search'))}" value="${esc(S.query)}"><div class="chips">${chip('ALL',t('all'))}${chip('DISH',t('dish'))}${chip('SUBRECIPE',t('prep'))}</div><div class="grid">${list.length?list.map(card).join(''):`<div class="empty">${esc(t('empty'))}</div>`}</div></div>`;$('#q').oninput=e=>{S.query=e.target.value;renderHome();requestAnimationFrame(()=>$('#q')?.focus())};view.querySelectorAll('[data-f]').forEach(x=>x.onclick=()=>{S.filter=x.dataset.f;renderHome()});view.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>openRecipe(x.dataset.r))}
function chip(v,l){return `<button class="chip ${S.filter===v?'active':''}" data-f="${v}">${esc(l)}</button>`}function card(r){let u=img(r.heroImage),isDish=String(r.recipeType).toUpperCase()==='DISH';return `<button class="card recipeCard" data-r="${esc(r._id)}"><div class="thumb">${u?`<img src="${esc(u)}">`:`<span class="muted">${esc(t('noPhoto'))}</span>`}</div><div class="meta"><span class="tag">${esc(isDish?t('dish'):t('prep'))}</span><h3>${esc(rname(r))}</h3><span class="muted">${esc(r.category||'')}</span></div></button>`}function openRecipe(id){S.route.push({id});S.modal=null;modal.innerHTML='';render();scrollTo(0,0)}
function renderRecipe(id){let r=S.recipes.find(x=>x._id===id);if(!r){S.route=[];render();return}let secs=S.sections.filter(x=>x.recipeId===id).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0)),hero=img(r.heroImage),method=txt(r,'methodEn','methodEs'),y=r.yieldQty?`${r.yieldQty} ${txt(r,'yieldUnitEn','yieldUnitEs')}`:'';view.innerHTML=`<div class="recipeView"><div class="crumbs"><button data-home>Recetario</button><span>›</span><span>${esc(rname(r))}</span></div><div class="hero"><div class="heroImage">${hero?`<img src="${esc(hero)}">`:`<span class="muted">${esc(t('noPhoto'))}</span>`}</div><div class="heroText"><span class="tag">${esc(String(r.recipeType).toUpperCase()==='DISH'?t('dish'):t('prep'))}</span><h1>${esc(rname(r))}</h1>${y?`<div class="yield"><b>${esc(t('yield'))}:</b>&nbsp;${esc(y)}</div>`:''}</div></div><div class="sections">${secs.map(section).join('')}${method?`<section class="section"><h2>${esc(t('method'))}</h2><div class="mop">${method}</div></section>`:''}</div></div>`;view.querySelector('[data-home]')?.addEventListener('click',()=>{S.route=[];render()});view.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>openComponent(x.dataset.c))}
function section(s){let rows=S.components.filter(c=>c.sectionId===s._id).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));return `<section class="section"><h2>${esc(txt(s,'titleEn','titleEs')||'Sección')}</h2>${rows.map(row).join('')}</section>`}function row(c){let type=String(c.componentType||'TEXT').toUpperCase(),click=['SUBRECIPE','INGREDIENT','PREPARATION'].includes(type),unit=S.lang==='es'?(c.unitEs||c.unitEn):(c.unitEn||c.unitEs),name=txt(c,'displayEn','displayEs'),note=txt(c,'noteEn','noteEs');if(!name&&c.targetRecipeId)name=rname(S.recipes.find(x=>x._id===c.targetRecipeId)||{});if(!name&&c.targetIngredientId)name=iname(S.ingredients.find(x=>x._id===c.targetIngredientId)||{});return `<button class="row" ${click?`data-c="${esc(c._id)}"`:''}><span class="qty">${c.quantity??''} ${esc(unit||'')}</span><span class="name">${esc(name||'—')}${note?`<span class="note">${esc(note)}</span>`:''}</span><span class="chev">${click?'›':''}</span></button>`}function openComponent(id){let c=S.components.find(x=>x._id===id);if(!c)return;let type=String(c.componentType||'').toUpperCase();if(type==='SUBRECIPE'&&c.targetRecipeId)openRecipe(c.targetRecipeId);else if(c.targetIngredientId){S.modal={ingredientId:c.targetIngredientId,prepId:c.targetPreparationId||''};renderModal()}}
function renderModal(){if(!S.modal){modal.innerHTML='';back.classList.toggle('hidden',!S.route.length);return}back.classList.remove('hidden');let ing=S.ingredients.find(x=>x._id===S.modal.ingredientId);if(!ing){S.modal=null;renderModal();return}let ps=S.preparations.filter(x=>x.ingredientId===ing._id),sel=ps.find(x=>x._id===S.modal.prepId)||null,bu=img(ing.baseImage),pu=img(sel?.image);modal.innerHTML=`<div class="modalShade" id="shade"><div class="modal"><div class="modalHead"><h2>${esc(iname(ing))}</h2><button id="close" class="icon">×</button></div>${ps.length?`<div class="prepList">${ps.map(p=>`<button class="prep ${sel?._id===p._id?'active':''}" data-p="${esc(p._id)}">${esc(pname(p))}</button>`).join('')}</div>`:''}<div class="photos">${photoBlock(t('whole'),iname(ing),bu,'ingredient',ing._id)}${sel?photoBlock(t('cut'),pname(sel),pu,'preparation',sel._id):`<article class="photo"><div class="pic muted">${esc(t('noCut'))}</div><div class="photoBody"><h3>${esc(t('cut'))}</h3></div></article>`}</div></div></div>`;$('#close').onclick=()=>{S.modal=null;renderModal()};$('#shade').onclick=e=>{if(e.target.id==='shade'){S.modal=null;renderModal()}};modal.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{S.modal.prepId=x.dataset.p;renderModal()});modal.querySelectorAll('[data-photo]').forEach(x=>x.onclick=()=>pickPhoto(x.dataset.type,x.dataset.id))}
function photoBlock(title,name,url,type,id){return `<article class="photo"><div class="pic">${url?`<img src="${esc(url)}">`:`<span class="muted">${esc(t('noPhoto'))}</span>`}</div><div class="photoBody"><h3>${esc(title)}</h3><p>${esc(name)}</p><button class="${url?'secondary':'primary'}" data-photo data-type="${type}" data-id="${esc(id)}">${url?t('replace'):t('add')}</button></div></article>`}function pickPhoto(type,id){let input=document.createElement('input');input.type='file';input.accept='image/*';input.capture='environment';input.onchange=()=>{let file=input.files?.[0];if(!file)return;let requestId='up_'+Date.now();S.pending.set(requestId,{file,type,id});toast('…',999999);send('REQUEST_MEDIA_UPLOAD_URL',{requestId,fileName:file.name||'photo.jpg',mimeType:file.type||'image/jpeg',sizeInBytes:file.size,entityType:type,entityId:id})};input.click()}
async function upload(p){let x=S.pending.get(p.requestId);if(!x)return;try{let r=await fetch(p.uploadUrl,{method:'PUT',headers:{'Content-Type':x.file.type||'image/jpeg'},body:x.file});if(!r.ok)throw Error(r.status);let d=await r.json(),f=d.file||{},im=f.media?.image?.image||{};send('SAVE_ENTITY_IMAGE',{requestId:p.requestId,entityType:x.type,entityId:x.id,image:{id:im.id||f.id,url:im.url||f.url,height:im.height||0,width:im.width||0,altText:''}})}catch(e){toast('Error',3000)}}function saved(p){let x=S.pending.get(p.requestId);S.pending.delete(p.requestId);let type=p.entityType||x?.type,id=p.entityId||x?.id;if(type==='ingredient'){let a=S.ingredients.find(i=>i._id===id);if(a)a.baseImage=p.image}if(type==='preparation'){let a=S.preparations.find(i=>i._id===id);if(a)a.image=p.image}toast('✓',1200);render();if(S.modal)renderModal()}
addEventListener('message',e=>{let m=e.data;if(typeof m==='string')try{m=JSON.parse(m)}catch{return}if(!m?.type)return;let p=m.payload||{};if(m.type==='WIX_READY')send('LOAD_MENU_DATA');if(m.type==='MENU_DATA_LOADED'){Object.assign(S,{recipes:p.recipes||[],sections:p.sections||[],components:p.components||[],ingredients:p.ingredients||[],preparations:p.preparations||[],loaded:true});render()}if(m.type==='MEDIA_UPLOAD_URL')upload(p);if(m.type==='ENTITY_IMAGE_SAVED')saved(p)});setLang(S.lang);send('MENU_HTML_READY',{version:'2.0.0',adaptiveMobile:true});})();
</script>
</body>
</html>
