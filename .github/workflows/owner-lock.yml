name: Owner Locked Boundaries

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard-owner-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve protected scopes
        id: guard
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-parse HEAD^)"
            fi
          fi

          if ! git cat-file -e "$BASE:.github/workflows/owner-lock.yml" 2>/dev/null; then
            echo "Bootstrap installation of owner lock."
            echo "scopes=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          printf '%s\n' "$CHANGED"

          SCOPES=""
          add_scope() {
            case " $SCOPES " in *" $1 "*) ;; *) SCOPES="$SCOPES $1";; esac
          }

          while IFS= read -r path; do
            case "$path" in
              OWNER_UNLOCK.md|CENTRO_VISUAL_LOCK.json|scripts/owner_unlock.py|.github/workflows/owner-lock.yml|AGENTS.md)
                add_scope owner-lock-infrastructure ;;
            esac
          done <<< "$CHANGED"

          VISUAL_MISMATCH="$(python - <<'PY'
          import json
          from pathlib import Path

          cfg=json.loads(Path("CENTRO_VISUAL_LOCK.json").read_text(encoding="utf-8"))
          text=Path(cfg["source"]).read_text(encoding="utf-8")
          start=text.find(cfg["visualBlockStart"])
          end=text.find(cfg["visualBlockEnd"], start)
          if start < 0 or end < 0:
              print("1")
              raise SystemExit
          block=text[start:end+2]

          h=14695981039346656037
          prime=1099511628211
          for ch in block:
              code=ord(ch)
              for b in (code & 0xff, (code >> 8) & 0xff):
                  h ^= b
                  h = (h * prime) & ((1<<64)-1)

          actual=f"{h:016x}"
          expected=str(cfg["fnv1a64Utf16le"]).lower()
          length_ok=len(block)==int(cfg["utf16Length"])
          print("0" if length_ok and actual==expected else "1")
          PY
          )"

          if [ "$VISUAL_MISMATCH" = "1" ]; then
            add_scope centro-visual
          fi

          SCOPES="$(echo "$SCOPES" | xargs || true)"
          echo "scopes=$SCOPES" >> "$GITHUB_OUTPUT"

          if [ -n "$SCOPES" ] && ! printf '%s\n' "$CHANGED" | grep -Fxq ".owner-unlock-proof.json"; then
            echo "::error::Locked Centro visual or lock infrastructure changed without a fresh signed owner proof."
            exit 1
          fi

      - name: Install proof verifier dependency
        if: steps.guard.outputs.scopes != ''
        run: python -m pip install --quiet cryptography

      - name: Verify signed owner unlock proof
        if: steps.guard.outputs.scopes != ''
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          for scope in ${{ steps.guard.outputs.scopes }}; do
            ARGS+=(--scope "$scope")
          done
          python scripts/owner_unlock.py verify "${ARGS[@]}"
