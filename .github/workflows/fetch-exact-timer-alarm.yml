name: Fetch exact timer alarm

on:
  push:
    paths:
      - ".github/workflows/fetch-exact-timer-alarm.yml"

permissions:
  contents: write

jobs:
  fetch-exact-alarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify exact Pixabay MP3
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, html, json, re, sys, urllib.parse, urllib.request
          from pathlib import Path

          PAGE = "https://pixabay.com/sound-effects/sfx-loud-beeping-bedside-alarm-clock-sound-effect-mono-453117/"
          EXPECTED_SHA256 = "158683d176477766f3cec8bf061ecc46484d4c1f1dcd8339cab96baf798c4f81"
          EXPECTED_SIZE = 371712
          OUT = Path("menu-dinamico/assets/timer-alarm.mp3")

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
          }
          req = urllib.request.Request(PAGE, headers=headers)
          raw = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")

          # Pixabay may serialize URLs normally, HTML-escaped, JSON-escaped, or unicode-escaped.
          variants = [
              raw,
              html.unescape(raw),
              raw.replace("\\/", "/"),
              html.unescape(raw).replace("\\/", "/"),
              raw.replace("\\u002F", "/").replace("\\u003A", ":"),
          ]
          candidates = []
          patterns = [
              r'https://cdn\.pixabay\.com/download/audio/[^"\'<>\\ ]+',
              r'https://cdn\.pixabay\.com/audio/[^"\'<>\\ ]+',
          ]
          for source in variants:
              for pat in patterns:
                  for u in re.findall(pat, source):
                      u = html.unescape(u).replace("\\/", "/")
                      if ".mp3" in u:
                          candidates.append(u)

          # Also inspect JSON string literals containing the filename/id.
          for m in re.findall(r'["\']([^"\']*453117[^"\']*\.mp3[^"\']*)["\']', raw):
              u = html.unescape(m).replace("\\/", "/").replace("\\u002F", "/").replace("\\u003A", ":")
              if u.startswith("//"):
                  u = "https:" + u
              if u.startswith("http"):
                  candidates.append(u)

          # Stable order, prefer URLs carrying the original filename/id.
          candidates = list(dict.fromkeys(candidates))
          candidates.sort(key=lambda u: ("453117" not in u, "sfx-loud-beeping" not in u, len(u)))

          print("candidate_count=", len(candidates))
          for u in candidates:
              try:
                  req = urllib.request.Request(u, headers=headers)
                  data = urllib.request.urlopen(req, timeout=30).read()
              except Exception as e:
                  print("download_failed", u[:160], repr(e))
                  continue
              sha = hashlib.sha256(data).hexdigest()
              print("candidate", len(data), sha, u[:180])
              if len(data) == EXPECTED_SIZE and sha == EXPECTED_SHA256:
                  OUT.parent.mkdir(parents=True, exist_ok=True)
                  OUT.write_bytes(data)
                  print("EXACT_MATCH", u)
                  sys.exit(0)

          raise SystemExit("No candidate matched the exact user-uploaded MP3 SHA-256 and size")
          PY

      - name: Confirm exact bytes
        shell: bash
        run: |
          test "$(wc -c < menu-dinamico/assets/timer-alarm.mp3)" = "371712"
          echo "158683d176477766f3cec8bf061ecc46484d4c1f1dcd8339cab96baf798c4f81  menu-dinamico/assets/timer-alarm.mp3" | sha256sum -c -

      - name: Commit exact alarm if changed
        shell: bash
        run: |
          if git diff --quiet -- menu-dinamico/assets/timer-alarm.mp3; then
            echo "Alarm asset already exact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu-dinamico/assets/timer-alarm.mp3
          git commit -m "fix(fichas): install exact user alarm MP3"
          git push
