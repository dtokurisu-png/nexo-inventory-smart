function renderRecipe(id){showCalc(true);let r=S.recipes.find(x=>x._id===id);if(!r){S.route=[];render();return}let isDish=String(r.recipeType).toUpperCase()==='DISH',secs=S.sections.filter(x=>x.recipeId===id).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0)),hero=img(r.heroImage),method=txt(r,'methodEn','methodEs'),y=r.yieldQty?`${r.yieldQty} ${txt(r,'yieldUnitEn','yieldUnitEs')}`:'';view.innerHTML=`<div class="recipeView" data-recipe-id="${esc(r._id)}"><div class="crumbs"><button data-home>Recetario</button><span>›</span><span>${esc(rname(r))}</span></div><div class="hero"><div class="heroImage">${hero?`<img src="${esc(hero)}">`:`<span class="muted">${esc(t('noPhoto'))}</span>`}<button type="button" class="heroPhotoBtn" data-photo-target data-photo-type="recipe" data-photo-id="${esc(r._id)}">📷 ${esc(hero?t('replace'):t('add'))}</button></div><div class="heroText"><span class="tag ${isDish?'tagDish':'tagPrep'}">${esc(isDish?t('dish'):t('prep'))}</span><h1>${esc(rname(r))}</h1>${y?`<div class="yield"><b>${esc(t('yield'))}:</b>&nbsp;${esc(y)}</div>`:''}</div></div><div class="sections">${secs.map(section).join('')}${method?`<section class="section"><h2>${esc(t('method'))}</h2><div class="mop">${method}</div></section>`:''}</div></div>`;view.querySelector('[data-home]')?.addEventListener('click',()=>{S.route=[];render()});view.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>openComponent(x.dataset.c));view.querySelectorAll('[data-unit]').forEach(x=>x.onclick=e=>{e.stopPropagation();openUnit(x.dataset.unit)});queueMicrotask(()=>window.dispatchEvent(new CustomEvent('NEXO_NATIVE_RENDERED',{detail:{kind:'recipe',recipeId:r._id}})))}
function section(s){let rows=S.components.filter(c=>c.sectionId===s._id).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));return `<section class="section"><h2>${esc(txt(s,'titleEn','titleEs')||'Sección')}</h2>${rows.map(row).join('')}</section>`}
function isSubrecipe(c){let type=String(c.componentType||'').toUpperCase(),note=(String(c.noteEn||'')+' '+String(c.noteEs||'')).toLowerCase(),name=(String(c.displayEn||'')+' '+String(c.displayEs||'')).toLowerCase();return type==='SUBRECIPE'||!!c.targetRecipeId||c.targetIngredientId==='puree'||(type==='TEXT'&&(note.includes('technical sheet pending')||note.includes('ficha técnica pendiente')))||name.includes('pumpkin puree')||name.includes('puré de calabaza')||name.includes('pumpkin soubise')||name.includes('soubise de calabaza')}
function unitFamily(u){let x=String(u||'').trim().toLowerCase().replace(/\./g,'');if(['g','kg','mg'].includes(x))return['unitMetricMass','metricMass'];if(['oz','lb','lbs'].includes(x))return['unitImperialMass','imperialMass'];if(['ml','l','cl'].includes(x))return['unitMetricVolume','metricVolume'];if(['ea','u','unit','units','pc','pcs','bu'].includes(x))return['unitCount','count'];if(['tsp','tbsp','cc','cp','cs','cdita','cda'].includes(x))return['unitSpoon','spoon'];if(['cup','cups','taza','tazas'].includes(x))return['unitCup','cup'];return['unitOther','other']}
function row(c){let type=String(c.componentType||'TEXT').toUpperCase(),sub=isSubrecipe(c),click=sub||['INGREDIENT','PREPARATION'].includes(type),unit=S.lang==='es'?(c.unitEs||c.unitEn):(c.unitEn||c.unitEs),name=txt(c,'displayEn','displayEs'),note=txt(c,'noteEn','noteEs');if(!name&&c.targetRecipeId)name=rname(S.recipes.find(x=>x._id===c.targetRecipeId)||{});if(!name&&c.targetIngredientId)name=iname(S.ingredients.find(x=>x._id===c.targetIngredientId)||{});let fam=unitFamily(unit),nameCls=sub?'nameSubrecipe':(['INGREDIENT','PREPARATION'].includes(type)?'nameProduct':''),chevCls=sub?'chevSubrecipe':'chevProduct';return `<button class="row" ${click?`data-c="${esc(c._id)}"`:''}><span class="qty"><span>${c.quantity??''}</span>${unit?`<span role="button" tabindex="0" class="unitBtn ${fam[0]}" data-unit="${esc(unit)}">${esc(unit)}</span>`:''}</span><span class="name ${nameCls}">${esc(name||'—')}${note?`<span class="note">${esc(note)}</span>`:''}</span><span class="chev ${click?chevCls:''}">${click?'›':''}</span></button>`}
function openComponent(id){let c=S.components.find(x=>x._id===id);if(!c)return;if(isSubrecipe(c)){S.modal={kind:'subrecipe',componentId:id};renderModal();return}if(c.targetIngredientId){S.modal={kind:'ingredient',ingredientId:c.targetIngredientId,prepId:c.targetPreparationId||''};renderModal()}}function openUnit(unit){S.modal={kind:'unit',unit};renderModal()}function closeModal(){S.modal=null;renderModal()}
function calcNum(){return Number(String(C.display).replace(',','.'))}function calcFmt(n){if(!Number.isFinite(n))return'Error';const a=Math.abs(n);if(a!==0&&(a>=1e12||a<1e-8))return n.toExponential(6);return String(Number(n.toFixed(10)))}function calcApply(a,b,op){if(op==='+')return a+b;if(op==='−')return a-b;if(op==='×')return a*b;if(op==='÷')return b===0?NaN:a/b;return b}function calcPaint(){const d=$('#calcDisplay'),e=$('#calcExpr');if(d)d.textContent=C.display;if(e)e.textContent=C.expr||' '}function calcDigit(v){if(C.display==='Error'){C.display='0';C.acc=null;C.op=null;C.expr='';C.fresh=true}if(C.fresh){C.display=v==='.'?'0.':v;C.fresh=false}else if(v==='.'||v===','){if(!C.display.includes('.')&&!C.display.includes(','))C.display+='.'}else if(C.display.replace(/[-.,]/g,'').length<12)C.display+=v;calcPaint()}function calcOperator(op){let cur=calcNum();if(!Number.isFinite(cur)){calcClear();return}if(C.op&&C.acc!==null&&!C.fresh){cur=calcApply(C.acc,cur,C.op);C.display=calcFmt(cur)}C.acc=cur;C.op=op;C.expr=`${C.display} ${op}`;C.fresh=true;calcPaint()}function calcPercent(){let cur=calcNum();if(!Number.isFinite(cur))return;if(C.acc!==null&&C.op&&(C.op==='+'||C.op==='−'))cur=C.acc*cur/100;else cur=cur/100;C.display=calcFmt(cur);C.fresh=true;calcPaint()}function calcEquals(){if(C.acc===null||!C.op)return;const b=calcNum(),a=C.acc,op=C.op,r=calcApply(a,b,op);C.expr=`${calcFmt(a)} ${op} ${calcFmt(b)} =`;C.display=calcFmt(r);C.acc=null;C.op=null;C.fresh=true;calcPaint()}function calcClear(){C.display='0';C.acc=null;C.op=null;C.expr='';C.fresh=true;calcPaint()}function calcBack(){if(C.fresh||C.display==='Error')return;C.display=C.display.length>1?C.display.slice(0,-1):'0';if(C.display==='-'||C.display==='')C.display='0';calcPaint()}function renderCalculator(){const body=`<div class="calcWrap"><div class="calcScreen"><div id="calcExpr" class="calcExpr"></div><div id="calcDisplay" class="calcDisplay">0</div></div><div class="calcGrid"><button class="calcKey ac" data-calc="ac">AC</button><button class="calcKey" data-calc="back">⌫</button><button class="calcKey op" data-calc="%">%</button><button class="calcKey op" data-calc="÷">÷</button><button class="calcKey" data-calc="7">7</button><button class="calcKey" data-calc="8">8</button><button class="calcKey" data-calc="9">9</button><button class="calcKey op" data-calc="×">×</button><button class="calcKey" data-calc="4">4</button><button class="calcKey" data-calc="5">5</button><button class="calcKey" data-calc="6">6</button><button class="calcKey op" data-calc="−">−</button><button class="calcKey" data-calc="1">1</button><button class="calcKey" data-calc="2">2</button><button class="calcKey" data-calc="3">3</button><button class="calcKey op" data-calc="+">+</button><button class="calcKey" data-calc="0">0</button><button class="calcKey" data-calc=".">.</button><button class="calcKey eq" data-calc="=">=</button></div><p class="calcHint">${esc(t('calcHint'))}</p></div>`;shell(t('calculator'),body);calcPaint();modal.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{const v=b.dataset.calc;if(/^\d$/.test(v)||v==='.')calcDigit(v);else if(['+','−','×','÷'].includes(v))calcOperator(v);else if(v==='%')calcPercent();else if(v==='=')calcEquals();else if(v==='ac')calcClear();else if(v==='back')calcBack()})}
function renderModal(){if(!S.modal){modal.innerHTML='';back.classList.toggle('hidden',!S.route.length);return}back.classList.remove('hidden');if(S.modal.kind==='calculator')return renderCalculator();if(S.modal.kind==='legend')return renderLegend();if(S.modal.kind==='unit')return renderUnit();if(S.modal.kind==='subrecipe')return renderSubrecipeModal();return renderIngredientModal()}function shell(title,body){modal.innerHTML=`<div class="modalShade" id="shade"><div class="modal"><div class="modalHead"><h2>${esc(title)}</h2><button id="close" class="icon">×</button></div>${body}</div></div>`;$('#close').onclick=closeModal;$('#shade').onclick=e=>{if(e.target.id==='shade')closeModal()}}
function renderSubrecipeModal(){let c=S.components.find(x=>x._id===S.modal.componentId);if(!c){closeModal();return}let recipe=c.targetRecipeId?S.recipes.find(r=>r._id===c.targetRecipeId):null,name=txt(c,'displayEn','displayEs')||(recipe?rname(recipe):'—'),pending=!recipe;let body=`<span class="tag tagPrep">${esc(t('subrecipe'))}</span><h2 style="margin:4px 0 8px;color:var(--prep)">${esc(name)}</h2><p class="modalText">${esc(pending?t('pending'):(S.lang==='es'?'Esta preparación tiene su propia ficha técnica.':'This preparation has its own technical sheet.'))}</p><div class="modalActions">${recipe?`<button id="openRecipeBtn" class="primary">${esc(t('openRecipe'))}</button>`:''}<button id="modalCloseBtn" class="secondary">${esc(t('close'))}</button></div>`;shell(name,body);$('#modalCloseBtn').onclick=closeModal;if(recipe)$('#openRecipeBtn').onclick=()=>openRecipe(recipe._id)}
function renderIngredientModal(){let ing=S.ingredients.find(x=>x._id===S.modal.ingredientId);if(!ing){closeModal();return}let ps=S.preparations.filter(x=>x.ingredientId===ing._id),sel=ps.find(x=>x._id===S.modal.prepId)||null,bu=img(ing.baseImage),pu=img(sel?.image);let prepPicker=ps.length?`<div class="prepList">${ps.map(p=>`<button class="prep ${sel?._id===p._id?'active':''}" data-p="${esc(p._id)}">${esc(pname(p))}</button>`).join('')}</div>`:'';let photos=`<div class="photos">${photoBlock(t('whole'),iname(ing),bu,'ingredient',ing._id)}${sel?photoBlock(t('cut'),pname(sel),pu,'preparation',sel._id):''}</div>`;shell(iname(ing),prepPicker+photos);modal.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{S.modal.prepId=x.dataset.p;renderModal()})}
function photoBlock(title,name,url,type,id){return `<article class="photo"><div class="pic">${url?`<img src="${esc(url)}">`:`<span class="muted">${esc(t('noPhoto'))}</span>`}</div><div class="photoBody"><h3>${esc(title)}</h3><p>${esc(name)}</p><button class="${url?'secondary':'primary'}" data-photo-target data-photo-type="${type}" data-photo-id="${esc(id)}">${url?t('replace'):t('add')}</button></div></article>`}
function unitInfo(unit){let fam=unitFamily(unit)[1],es=S.lang==='es';let map={metricMass:es?'Masa métrica. g = gramos; kg = kilogramos. 1 kg = 1000 g.':'Metric mass. g = grams; kg = kilograms. 1 kg = 1000 g.',imperialMass:es?'Masa imperial. oz = onzas; lb = libras. 1 lb = 16 oz.':'Imperial mass. oz = ounces; lb = pounds. 1 lb = 16 oz.',metricVolume:es?'Volumen métrico. ml = mililitros; L = litros. 1 L = 1000 ml.':'Metric volume. ml = milliliters; L = liters. 1 L = 1000 ml.',count:es?'Conteo por pieza o unidad. Se usa cuando el ingrediente se cuenta, no se pesa.':'Piece or unit count. Used when an ingredient is counted rather than weighed.',spoon:es?'Medidas por cuchara.':'Spoon measures.',cup:es?'Medida por taza.':'Cup measure.',other:es?'Unidad especial o cantidad según necesidad.':'Special unit or quantity as needed.'};return map[fam]}
function renderUnit(){let u=S.modal.unit,f=unitFamily(u);shell(`${t('unit')}: ${u}`,`<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><span class="unitBtn ${f[0]}">${esc(u)}</span><strong>${esc(t('unit'))}</strong></div><p class="modalText">${esc(unitInfo(u))}</p>`)}
function renderLegend(){let es=S.lang==='es',rows=[['var(--dish)',t('dish'),es?'Ficha final que se sirve al cliente.':'Final dish served to the guest.'],['var(--prep)',t('prep'),es?'Subreceta o preparación reutilizable.':'Reusable preparation or subrecipe.'],['var(--product)',t('product'),es?'Ingrediente o producto base.':'Base ingredient or product.'],['var(--metricMass)','g / kg',es?'Masa métrica.':'Metric mass.'],['var(--imperialMass)','oz / lb',es?'Masa imperial.':'Imperial mass.'],['var(--metricVolume)','ml / L',es?'Volumen métrico.':'Metric volume.'],['var(--count)','ea / u',es?'Conteo por unidad.':'Count by unit.'],['var(--spoon)','tsp / tbsp',es?'Cucharas.':'Spoon measures.'],['var(--cup)','cup',es?'Tazas.':'Cup measures.']];shell(t('legend'),`<div class="legend">${rows.map(r=>`<div class="legendRow"><span class="swatch" style="background:${r[0]}"></span><div><b>${esc(r[1])}</b><small>${esc(r[2])}</small></div></div>`).join('')}</div>`)}
function applyPhoto(detail){if(!detail?.entityType||!detail.entityId||!detail.image)return;const {entityType,entityId,image}=detail;if(entityType==='recipe'){const r=S.recipes.find(x=>x._id===entityId);if(r)r.heroImage=image}else if(entityType==='ingredient'){const i=S.ingredients.find(x=>x._id===entityId);if(i)i.baseImage=image}else if(entityType==='preparation'){const p=S.preparations.find(x=>x._id===entityId);if(p)p.image=image}if(S.route.at(-1)?.id===entityId)render();if(S.modal)renderModal()}

addEventListener('message',e=>{let m=e.data;if(typeof m==='string')try{m=JSON.parse(m)}catch{return}if(!m?.type)return;let p=m.payload||{};if(m.type==='WIX_READY')send('LOAD_MENU_DATA');if(m.type==='MENU_DATA_LOADED'){Object.assign(S,{recipes:p.recipes||[],sections:p.sections||[],components:p.components||[],ingredients:p.ingredients||[],preparations:p.preparations||[],loaded:true});render()}if(m.type==='ERROR'&&p.message)toast(p.message,3000)});window.NEXO_MENU_API={openRecipe,render,home:()=>{S.route=[];S.modal=null;modal.innerHTML='';render()},getData:()=>S};setLang(S.lang);send('MENU_HTML_READY',{version:'4.1.0',adaptiveMobile:true,visualTaxonomy:true,photoSystem:'external-v1'});})();
