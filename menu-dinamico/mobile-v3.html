/* Unified Nexo application header · workspace logic */
.topbar{
  height:calc(var(--header) + env(safe-area-inset-top));
  gap:14px;
  background:var(--nxo-header-background);
  border-bottom:1px solid var(--nxo-header-border);
  box-shadow:0 10px 30px var(--nxo-shadow);
  backdrop-filter:blur(20px) saturate(118%);
}
.brand{gap:10px;min-width:180px}
.mark{
  width:36px;height:36px;border-radius:11px;
  background:var(--nxo-accent);
  color:var(--nxo-accent-contrast);border:1px solid var(--nxo-header-border);
  box-shadow:0 8px 22px var(--nxo-shadow);
  font-size:17px;
}
.brandText{display:grid;line-height:1.1}
.brandText strong{font-size:13px;color:var(--nxo-header-text)}
.brandText small{margin-top:3px;font-size:10px;color:var(--nxo-header-muted);font-weight:600}
.nexoNav{display:flex;align-self:stretch;align-items:stretch;gap:16px;min-width:0}
.nexoNavLink{
  position:relative;border:0;background:transparent;color:var(--nxo-header-muted);padding:0 2px;
  font:inherit;font-size:12px;font-weight:760;white-space:nowrap
}
.nexoNavLink:after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px 3px 0 0;background:transparent
}
.nexoNavLink:hover,.nexoNavLink:focus-visible{color:var(--nxo-header-text);outline:none}
.nexoNavLink:hover:after,.nexoNavLink:focus-visible:after{background:var(--nxo-header-active)}
.nexoNavLink.active{color:var(--nxo-header-active);font-weight:900}
.nexoNavLink.active:after{background:var(--nxo-header-active)}
.topUtility{display:flex;align-items:center;gap:7px}
.icon,.lang,.installBtn{
  border-color:var(--nxo-header-border);background:transparent;color:var(--nxo-header-text);
}
.icon:hover,.lang:hover,.installBtn:hover,.icon:focus-visible,.lang:focus-visible,.installBtn:focus-visible{
  background:var(--nxo-interaction);color:var(--nxo-interaction-contrast);border-color:var(--nxo-interaction)
}
@media(max-width:900px){
  .nexoNav{gap:10px}.nexoNavLink{font-size:11px}.brand{min-width:0}
}
@media(max-width:720px){
  .topbar{gap:7px;background:var(--nxo-header-background)}
  .nexoNav{display:none}
  .brandText strong{font-size:14px}
  .brandText small{display:none}
  .topUtility{gap:5px}
}

    T.notificationRegistrationPromise=navigator.serviceWorker.register(TIMER_NOTIFICATION_SW,{scope:'./',updateViaCache:'none'})

function renderCommentModal(){const r=S.recipes.find(x=>x._id===S.modal?.recipeId);if(!r){closeModal();return}const body=`<p class="modalText">${esc(t('commentHint'))}</p><textarea id="commentText" class="commentText" maxlength="2000" placeholder="${esc(t('commentPlaceholder'))}"></textarea><div id="commentError" class="commentError"></div><div class="modalActions"><button id="commentSave" class="primary">${iconTag('comentarios')}<span>${esc(t('sendComment'))}</span></button><button id="commentCancel" class="secondary">${esc(t('close'))}</button></div>`;shell(t('commentTitle')+' · '+rname(r),body);const input=$('#commentText'),save=$('#commentSave');$('#commentCancel').onclick=closeModal;input?.focus();save.onclick=()=>{const comment=String(input?.value||'').trim();if(!comment){const err=$('#commentError');if(err)err.textContent=S.lang==='es'?'Escribe un comentario antes de enviarlo.':'Write a comment before sending.';return}const requestId='recipe-comment-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);S.modal.requestId=requestId;save.disabled=true;save.textContent=t('sendingComment');const err=$('#commentError');if(err)err.textContent='';send('NEXO_DM_RECIPE_COMMENT',{requestId,technicalSheetId:r._id,recipeTitle:rname(r),comment})}}
function renderModal(){if(!S.modal){modal.innerHTML='';back.classList.toggle('hidden',!S.route.length);return}back.classList.remove('hidden');if(S.modal.kind==='calculator')return renderCalculator();if(S.modal.kind==='timers')return renderTimers();if(S.modal.kind==='comment')return renderCommentModal();if(S.modal.kind==='legend')return renderLegend();if(S.modal.kind==='unit')return renderUnit();if(S.modal.kind==='subrecipe')return renderSubrecipeModal();return renderIngredientModal()}function shell(title,body,modalClass=''){modal.innerHTML=`<div class="modalShade" id="shade"><div class="modal ${esc(modalClass)}"><div class="modalHead"><h2>${esc(title)}</h2><button id="close" class="modalClose" type="button" aria-label="${esc(t('close'))}">${iconTag('cerrar')}</button></div>${body}</div></div>`;$('#close').onclick=closeModal;$('#shade').onclick=e=>{if(e.target.id==='shade')closeModal()}}
function renderSubrecipeModal(){let c=S.components.find(x=>x._id===S.modal.componentId);if(!c){closeModal();return}let recipe=c.targetRecipeId?S.recipes.find(r=>r._id===c.targetRecipeId):null,name=txt(c,'displayEn','displayEs')||(recipe?rname(recipe):'—'),pending=!recipe;let body=`<span class="tag tagPrep">${esc(t('subrecipe'))}</span><h2 style="margin:4px 0 8px;color:var(--prep)">${esc(name)}</h2><p class="modalText">${esc(pending?t('pending'):(S.lang==='es'?'Esta preparación tiene su propia ficha técnica.':'This preparation has its own technical sheet.'))}</p><div class="modalActions">${recipe?`<button id="openRecipeBtn" class="primary">${esc(t('openRecipe'))}</button>`:''}<button id="modalCloseBtn" class="secondary">${esc(t('close'))}</button></div>`;shell(name,body);$('#modalCloseBtn').onclick=closeModal;if(recipe)$('#openRecipeBtn').onclick=()=>openRecipe(recipe._id)}
function renderIngredientModal(){let ing=S.ingredients.find(x=>x._id===S.modal.ingredientId);if(!ing){closeModal();return}let ps=S.preparations.filter(x=>x.ingredientId===ing._id),sel=ps.find(x=>x._id===S.modal.prepId)||null,bu=img(ing.baseImage),pu=img(sel?.image);let prepPicker=ps.length?`<div class="prepList">${ps.map(p=>`<button class="prep ${sel?._id===p._id?'active':''}" data-p="${esc(p._id)}">${esc(pname(p))}</button>`).join('')}</div>`:'';let photos=`<div class="photos">${photoBlock(t('whole'),iname(ing),bu,'ingredient',ing._id)}${sel?photoBlock(t('cut'),pname(sel),pu,'preparation',sel._id):''}</div><div class="modalActions"><button id="ingredientDone" class="primary">✓ ${esc(t('done'))}</button></div>`;shell(iname(ing),prepPicker+photos);modal.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{S.modal.prepId=x.dataset.p;renderModal()});$('#ingredientDone').onclick=closeModal}
function photoBlock(title,name,url,type,id){return `<article class="photo"><div class="pic">${url?`<img src="${esc(url)}">`:`<span class="muted">${esc(t('noPhoto'))}</span>`}</div><div class="photoBody"><h3>${esc(title)}</h3><p>${esc(name)}</p><button class="${url?'secondary':'primary'}" data-photo-target data-photo-type="${type}" data-photo-id="${esc(id)}">${iconTag(url?'editar-imagen':'foto')}<span>${url?t('replace'):t('add')}</span></button></div></article>`}
function unitInfo(unit){let fam=unitFamily(unit)[1],es=S.lang==='es';let map={metricMass:es?'Masa métrica. g = gramos; kg = kilogramos. 1 kg = 1000 g.':'Metric mass. g = grams; kg = kilograms. 1 kg = 1000 g.',imperialMass:es?'Masa imperial. oz = onzas; lb = libras. 1 lb = 16 oz.':'Imperial mass. oz = ounces; lb = pounds. 1 lb = 16 oz.',metricVolume:es?'Volumen métrico. ml = mililitros; L = litros. 1 L = 1000 ml.':'Metric volume. ml = milliliters; L = liters. 1 L = 1000 ml.',count:es?'Conteo por pieza o unidad. Se usa cuando el ingrediente se cuenta, no se pesa.':'Piece or unit count. Used when an ingredient is counted rather than weighed.',spoon:es?'Medidas por cuchara.':'Spoon measures.',cup:es?'Medida por taza.':'Cup measure.',other:es?'Unidad especial o cantidad según necesidad.':'Special unit or quantity as needed.'};return map[fam]}
function renderUnit(){let u=S.modal.unit,f=unitFamily(u);shell(`${t('unit')}: ${u}`,`<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><span class="unitBtn ${f[0]}">${esc(u)}</span><strong>${esc(t('unit'))}</strong></div><p class="modalText">${esc(unitInfo(u))}</p>`)}
function renderLegend(){let es=S.lang==='es',rows=[['var(--dish)',t('dish'),es?'Ficha final que se sirve al cliente.':'Final dish served to the guest.'],['var(--prep)',t('prep'),es?'Subreceta o preparación reutilizable.':'Reusable preparation or subrecipe.'],['var(--product)',t('product'),es?'Ingrediente o producto base.':'Base ingredient or product.'],['var(--metricMass)','g / kg',es?'Masa métrica.':'Metric mass.'],['var(--imperialMass)','oz / lb',es?'Masa imperial.':'Imperial mass.'],['var(--metricVolume)','ml / L',es?'Volumen métrico.':'Metric volume.'],['var(--count)','ea / u',es?'Conteo por unidad.':'Count by unit.'],['var(--spoon)','tsp / tbsp',es?'Cucharas.':'Spoon measures.'],['var(--cup)','cup',es?'Tazas.':'Cup measures.']];shell(t('legend'),`<div class="legend">${rows.map(r=>`<div class="legendRow"><span class="swatch" style="background:${r[0]}"></span><div><b>${esc(r[1])}</b><small>${esc(r[2])}</small></div></div>`).join('')}</div>`,'nexoLegendModal')}
function applyPhoto(detail){if(!detail?.entityType||!detail.entityId||!detail.image)return;const {entityType,entityId,image}=detail;if(entityType==='recipe'){const r=S.recipes.find(x=>x._id===entityId);if(r)r.heroImage=image}else if(entityType==='ingredient'){const i=S.ingredients.find(x=>x._id===entityId);if(i)i.baseImage=image}else if(entityType==='preparation'){const p=S.preparations.find(x=>x._id===entityId);if(p)p.image=image}if(S.route.at(-1)?.id===entityId)render();if(S.modal)renderModal()}
addEventListener('NEXO_PHOTO_CHANGED',e=>applyPhoto(e.detail));
addEventListener('message',e=>{let m=e.data;if(typeof m==='string')try{m=JSON.parse(m)}catch{return}if(!m?.type)return;let p=m.payload||{};if(m.type==='WIX_READY')send('LOAD_MENU_DATA');if(m.type==='MENU_DATA_LOADED'){Object.assign(S,{recipes:p.recipes||[],sections:p.sections||[],components:p.components||[],ingredients:p.ingredients||[],preparations:p.preparations||[],loaded:true});render();send('NUMA_ENGINE_DATA_READY',{recipeCount:S.recipes.length})}if(m.type==='ERROR'&&p.message)toast(p.message,3000)});window.NEXO_MENU_API={openRecipe,render,home:()=>{S.route=[];S.modal=null;modal.innerHTML='';render()},getData:()=>S};if('serviceWorker'in navigator){
  ensureTimerNotificationWorker().catch(()=>{});
  navigator.serviceWorker.addEventListener('message',event=>{
    const m=event.data||{};
    if(m.type==='NEXO_TIMER_NOTIFICATION_STOP'&&m.timerId)acknowledgeKitchenTimer(m.timerId);
    else if(m.type==='NEXO_TIMER_NOTIFICATION_OPEN'){S.modal={kind:'timers'};renderModal()}
  })
}
addEventListener('message',event=>{
  const m=event.data||{};
  if(m.type==='NEXO_TIMER_NOTIFICATION_PERMISSION'){
    refreshTimerNotificationUI();
    if(m.permission==='granted')notifyDueTimers()
  }
});
addEventListener('focus',()=>{timerTick();refreshTimerNotificationUI();notifyDueTimers()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){timerTick();refreshTimerNotificationUI();notifyDueTimers()}});
setLang(S.lang);send('MENU_HTML_READY',{version:'4.3.2',adaptiveMobile:true,visualTaxonomy:true,photoSystem:'external-v2-central-sync',timers:'named-multi-timers-system-notifications-v4',search:'full-index-v2',numaContinuation:'ack-v1'});})();
</script>
