<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Menú Dinámico</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100dvh;border:0;background:#fff}</style></head><body><iframe id="app" src="./mobile-v2.html?v=20260902-3" allow="camera" title="Menú Dinámico"></iframe><script>(()=>{'use strict';const f=document.getElementById('app');let data=null,promise=null;const send=(type,payload={})=>f.contentWindow.postMessage({type,payload},'*');function load(){if(data)return Promise.resolve(data);if(promise)return promise;promise=fetch('./data.json?ts=20260902-1',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('No se pudo cargar data.json: '+r.status);return r.json()}).then(d=>(data=d));return promise}function note(text){try{const s=f.contentDocument.getElementById('status');if(!s)return;s.textContent=text;s.classList.remove('hidden');setTimeout(()=>s.classList.add('hidden'),3200)}catch(_){}}addEventListener('message',e=>{if(e.source!==f.contentWindow)return;let m=e.data;if(typeof m==='string')try{m=JSON.parse(m)}catch{return}if(!m?.type)return;if(m.type==='MENU_HTML_READY'){send('WIX_READY',{ok:true,mode:'live-host',version:'2.1.0'});load().then(d=>send('MENU_DATA_LOADED',d)).catch(err=>note(String(err)))}else if(m.type==='LOAD_MENU_DATA'){load().then(d=>send('MENU_DATA_LOADED',d)).catch(err=>note(String(err)))}else if(m.type==='REQUEST_MEDIA_UPLOAD_URL'){note('La ficha de foto está lista; el guardado global en Wix se está conectando.')}});f.addEventListener('load',()=>{send('WIX_READY',{ok:true,mode:'live-host',version:'2.1.0'});load().then(d=>send('MENU_DATA_LOADED',d)).catch(()=>{})});})();</script></body></html>
