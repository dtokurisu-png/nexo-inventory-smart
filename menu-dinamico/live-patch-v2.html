<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Menú Dinámico</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#host{display:block;width:100%;height:100dvh;border:0;background:#fff}</style></head><body><iframe id="host" src="./live.html?v=20260903-8" allow="camera" title="Menú Dinámico"></iframe><script>(()=>{'use strict';const host=document.getElementById('host');function inject(){try{const liveDoc=host.contentDocument;if(!liveDoc)return false;const app=liveDoc.getElementById('app');if(!app||!app.contentDocument)return false;const doc=app.contentDocument;if(!doc.getElementById('nexo-stripe-system-v3')){const old=doc.getElementById('nexo-stripe-system-v2');if(old)old.remove();const l=doc.createElement('link');l.id='nexo-stripe-system-v3';l.rel='stylesheet';l.href='./stripe-system-v3.css?v=20260903-1';doc.head.appendChild(l)}if(!doc.getElementById('nexo-detail-classification-v2')){const s=doc.createElement('script');s.id='nexo-detail-classification-v2';s.src='./detail-classification-v2.js?v=20260903-1';doc.head.appendChild(s)}return true}catch(_){return false}}function schedule(){let n=0;const t=setInterval(()=>{inject();if(++n>100)clearInterval(t)},100);try{const liveDoc=host.contentDocument;if(liveDoc){new MutationObserver(()=>inject()).observe(liveDoc,{subtree:true,childList:true})}}catch(_){}}host.addEventListener('load',schedule);window.addEventListener('message',e=>{if(e.source===host.contentWindow){parent.postMessage(e.data,'*')}else if(e.source===parent){host.contentWindow.postMessage(e.data,'*')}});})();</script></body></html>
