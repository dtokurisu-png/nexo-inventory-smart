.modalShade{position:fixed;z-index:100;inset:0;background:rgba(16,14,10,.64);display:flex;justify-content:center;align-items:flex-end}.modal{width:min(720px,100%);max-height:92dvh;overflow:auto;background:var(--panel);border-radius:24px 24px 0 0;padding:14px 16px max(22px,env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.22)}.modalHead{position:sticky;top:-14px;z-index:2;display:flex;align-items:center;gap:8px;margin:-14px -16px 12px;padding:11px 16px;background:rgba(255,253,250,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.modalHead h2{margin:0;flex:1;font-size:18px}.modalText{line-height:1.55;color:var(--muted)}.modalActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}.photo{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff}.pic{aspect-ratio:4/3;background:#ece6db;display:grid;place-items:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.photoBody{padding:12px}.photoBody h3{margin:0 0 5px;font-size:14px}.photoBody p{margin:4px 0 10px}.primary,.secondary{border-radius:12px;padding:10px 12px;font-weight:850}.primary{border:1px solid var(--ink);background:var(--ink);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.prepList{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.prep{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px}.prep.active{border-color:var(--product);color:var(--product);font-weight:850}.legend{display:grid;gap:10px}.legendRow{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start}.swatch{width:18px;height:18px;border-radius:5px;margin-top:2px}.legendRow b{display:block}.legendRow small{color:var(--muted);line-height:1.4}.status{position:fixed;z-index:120;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:92vw;padding:10px 13px;border-radius:12px;background:#1d1a16;co @media(max-width:720px){:root{--header:58px;--radius:0}html,body{background:var(--panel)}.app{min-height:100dvh}.brandText{max-width:125px}.mark{display:none}.topbar{background:rgba(255,253,250,.985)}main{max-width:none;padding:0 0 max(60px,env(safe-area-inset-bottom))}.homeView{padding:16px 12px 24px}.title{font-size:31px}.subtitle{font-size:14px}.grid{grid-template-columns:1fr;gap:10px}.recipeCard{display:grid;grid-template-columns:105px 1fr;min-height:92px;border-radius:15px;box-shadow:none}.recipeCard:before{height:6px}.thumb{aspect-ratio:auto;height:100%;min-height:92px}.meta{display:flex;flex-direction:column;justify-content:center;padding:11px 12px}.meta h3{font-size:17px}.recipeView{position:relative;min-height:calc(100dvh - var(--header) - env(safe-area-inset-top));background:var(--panel);padding:0 0 26px}.crumbs{display:none}.hero{display:flex;flex-direction:column;gap:0}.heroText{order:-1;padding:16px 14px 12px;border-bottom:1px solid var(--line)}.heroText h1{font-size:33px;margin:3px 0 9px}.heroImage{width:100%;min-height:0;aspect-ratio:16/9;border:0;border-radius:0}.heroImage img{max-height:none}.sections{margin:0;gap:0}.section{padding:15px 14px;border:0;border-bottom:8px solid var(--bg);border-radius:0}.section h2{font-size:18px}.row{grid-template-columns:86px 1fr auto;padding:14px 1px;min-height:52px}.qty{font-size:14px;gap:4px}.unitBtn{font-size:11px;padding:4px 6px}.name{font-size:15px}.modalShade{align-items:stretch}.modal{width:100%;height:100dvh;max-height:none;border-radius:0;padding-top:calc(12px + env(safe-area-inset-top))}.modalHead{top:calc(-12px - env(safe-area-inset-top));margin-top:calc(-12px - env(safe-area-inset-top));padding-top:calc(10px + env(safe-area-inset-top))}.photos{grid-template-columns:1fr}.pic{aspect-ratio:16/10}.status{bottom:max(12px,env(safe-area-inset-bottom))}}

<body>
<div class="app"><header class="topbar"><button id="back" class="icon hidden">←</button><div class="brand"><div class="mark">NG</div><div class="brandText">Menú Dinámico</div></div><div class="spacer"></div><button id="legendBtn" class="icon" aria-label="Guía">?</button><button id="home" class="icon">⌂</button><button id="lang" class="lang">ES</button></header><main id="view"></main></div><div id="modal"></div><div id="status" class="status hidden"></div>
<script>
(()=>{'use strict';
const I={es:{library:'Recetario dinámico',sub:'Fichas técnicas, preparaciones e ingredientes conectados.',search:'Buscar receta o preparación…',all:'Todo',dish:'Platos',prep:'Preparaciones',product:'Productos',yield:'Rendimiento',method:'Método / MOP',noPhoto:'Sin foto',whole:'Producto entero / base',cut:'Preparación / corte',add:'Agregar foto',replace:'Cambiar foto',empty:'Todavía no hay recetas cargadas',waiting:'Esperando conexión con Wix…',legend:'Guía de colores',openRecipe:'Abrir receta',pending:'Ficha técnica pendiente',subrecipe:'Preparación / subreceta',ingredient:'Producto / ingrediente',unit:'Unidad de medida',close:'Cerrar'},en:{library:'Dynamic recipe book',sub:'Connected technical sheets, preparations, and ingredients.',search:'Search recipe or preparation…',all:'All',dish:'Dishes',prep:'Preparations',product:'Products',yield:'Yield',method:'Method / MOP',noPhoto:'No photo',whole:'Whole / base product',cut:'Preparation / cut',add:'Add photo',replace:'Replace photo',empty:'No recipes have been added yet',waiting:'Waiting for Wix connection…',legend:'Color guide',openRecipe:'Open recipe',pending:'Technical sheet pending',subrecipe:'Preparation / subrecipe',ingredient:'Product / ingredient',unit:'Unit of measure',close:'Close'}};
const S={lang:localStorage.getItem('nexo_dynamic_menu_lang')||'es',recipes:[],sections:[],components:[],ingredients:[],preparations:[],route:[],filter:'ALL',query:'',loaded:false,modal:null,pending:new Map()};
const $=q=>document.querySelector(q),view=$('#view'),modal=$('#modal'),back=$('#back'),lang=$('#lang'),status=$('#status');const t=k=>I[S.lang][k]||k,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),txt=(o,a,b)=>S.lang==='es'?(o?.[b]||o?.[a]||''):(o?.[a]||o?.[b]||''),rname=r=>txt(r,'titleEn','titleEs')||'—',iname=x=>txt(x,'nameEn','nameEs')||'—',pname=x=>txt(x,'nameEn','nameEs')||'—',img=x=>x&&(x.url||x.image?.url||x.src)||'';const send=(type,payload={})=>parent.postMessage({type,payload},'*');
function toast(m,ms=2200){status.textContent=m;status.classList.remove('hidden');clearTimeout(toast.x);toast.x=setTimeout(()=>status.classList.add('hidden'),ms)}function setLang(v){S.lang=v;localStorage.setItem('nexo_dynamic_menu_lang',v);lang.textContent=v.toUpperCase();document.documentElement.lang=v;render();if(S.modal)renderModal()}lang.onclick=()=>setLang(S.lang==='es'?'en':'es');$('#home').onclick=()=>{S.route=[];S.modal=null;modal.innerHTML='';render()};$('#legendBtn').onclick=()=>{S.modal={kind:'legend'};renderModal()};back.onclick=()=>{if(S.modal){S.modal=null;renderModal()}else if(S.route.length){S.route.pop();render();scrollTo(0,0)}};
function render(){lang.textContent=S.lang.toUpperCase();back.classList.toggle('hidden',!S.route.length&&!S.modal);if(!S.loaded){view.innerHTML=`<div class="homeView"><div class="empty">${esc(t('waiting'))}</div></div>`;return}const cur=S.route.at(-1);cur?renderRecipe(cur.id):renderHome()}
function renderHome(){let list=S.recipes.filter(r=>r.active!==false),q=S.query.trim().toLowerCase();if(S.filter==='DISH')list=list.filter(r=>String(r.recipeType).toUpperCase()==='DISH');if(S.filter==='SUBRECIPE')list=list.filter(r=>String(r.recipeType).toUpperCase()!=='DISH');if(q)list=list.filter(r=>[r.titleEn,r.titleEs,r.category].some(v=>String(v||'').toLowerCase().includes(q)));list.sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));view.innerHTML=`<div class="homeView"><h1 class="title">${esc(t('library'))}</h1><p class="subtitle">${esc(t('sub'))}</p><input id="q" class="search" placeholder="${esc(t('search'))}" value="${esc(S.query)}"><div class="chips">${chip('ALL',t('all'))}${chip('DISH',t('dish'))}${chip('SUBRECIPE',t('prep'))}</div><div class="grid">${list.length?list.map(card).join(''):`<div class="empty">${esc(t('empty'))}</div>`}</div></div>`;$('#q').oninput=e=>{S.query=e.target.value;renderHome();requestAnimationFrame(()=>$('#q')?.focus())};view.querySelectorAll('[data-f]').forEach(x=>x.onclick=()=>{S.filter=x.dataset.f;renderHome()});view.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>openRecipe(x.dataset.r))}
function chip(v,l){return `<button class="chip ${S.filter===v?'active':''}" data-f="${v}">${esc(l)}</button>`}
function card(r){let u=img(r.heroImage),isDish=String(r.recipeType).toUpperCase()==='DISH',cls=isDish?'cardDish':'cardPrep',tagCls=isDish?'tagDish':'tagPrep';return `<button class="card recipeCard ${cls}" data-r="${esc(r._id)}"><div class="thumb">${u?`<img src="${esc(u)}">`:`<span class="muted">${esc(t('noPhoto'))}</span>`}</div><div class="meta"><span class="tag ${tagCls}">${esc(isDish?t('dish'):t('prep'))}</span><h3>${esc(rname(r))}</h3><span class="muted">${esc(r.category||'')}</span></div></button>`}
function openRecipe(id){S.route.push({id});S.modal=null;modal.innerHTML='';render();scrollTo(0,0)}
function renderRecipe(id){let r=S.recipes.find(x=>x._id===id);if(!r){S.route=[];render();return}let isDish=String(r.recipeType).toUpperCase()==='DISH',secs=S.sections.filter(x=>x.recipeId===id).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0)),hero=img(r.heroImage),method=txt(r,'methodEn','methodEs'),y=r.yieldQty?`${r.yieldQty} ${txt(r,'yieldUnitEn','yieldUnitEs')}`:'';view.innerHTML=`<div class="recipeView"><div class="crumbs"><button data-home>Recetario</button><span>›</span><span>${esc(rname(r))}</span></div><div class="hero"><div class="heroImage">${hero?`<img src="${esc(hero)}">`:`<span class="muted">${esc(t('noPhoto'))}</span>`}</div><div class="heroText"><span class="tag ${isDish?'tagDish':'tagPrep'}">${esc(isDish?t('dish'):t('prep'))}</span><h1>${esc(rname(r))}</h1>${y?`<div class="yield"><b>${esc(t('yield'))}:</b>&nbsp;${esc(y)}</div>`:''}</div></div><div class="sections">${secs.map(section).join('')}${method?`<section class="section"><h2>${esc(t('method'))}</h2><div class="mop">${method}</div></section>`:''}</div></div>`;view.querySelector('[data-home]')?.addEventListener('click',()=>{S.route=[];render()});view.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>openComponent(x.dataset.c));view.querySelectorAll('[data-unit]').forEach(x=>x.onclick=e=>{e.stopPropagation();openUnit(x.dataset.unit)})}
function section(s){let rows=S.components.filter(c=>c.sectionId===s._id).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));return `<section class="section"><h2>${esc(txt(s,'titleEn','titleEs')||'Sección')}</h2>${rows.map(row).join('')}</section>`}
function isSubrecipe(c){let type=String(c.componentType||'').toUpperCase(),note=(String(c.noteEn||'')+' '+String(c.noteEs||'')).toLowerCase(),name=(String(c.displayEn||'')+' '+String(c.displayEs||'')).toLowerCase();return type==='SUBRECIPE'||!!c.targetRecipeId||c.targetIngredientId==='puree'||(type==='TEXT'&&(note.includes('technical sheet pending')||note.includes('ficha técnica pendiente')))||(name.includes('pumpkin puree')||name.includes('puré de calabaza')||name.includes('pumpkin soubise')||name.includes('soubise de calabaza'))}
function unitFamily(u){let x=String(u||'').trim().toLowerCase().replace(/\./g,'');if(['g','kg','mg'].includes(x))return['unitMetricMass','metricMass'];if(['oz','lb','lbs'].includes(x))return['unitImperialMass','imperialMass'];if(['ml','l','cl'].includes(x))return['unitMetricVolume','metricVolume'];if(['ea','u','unit','units','pc','pcs'].includes(x))return['unitCount','count'];if(['tsp','tbsp','cdita','cda'].includes(x))return['unitSpoon','spoon'];if(['cup','cups','taza','tazas'].includes(x))return['unitCup','cup'];return['unitOther','other']}
function row(c){let type=String(c.componentType||'TEXT').toUpperCase(),sub=isSubrecipe(c),click=sub||['INGREDIENT','PREPARATION'].includes(type),unit=S.lang==='es'?(c.unitEs||c.unitEn):(c.unitEn||c.unitEs),name=txt(c,'displayEn','displayEs'),note=txt(c,'noteEn','noteEs');if(!name&&c.targetRecipeId)name=rname(S.recipes.find(x=>x._id===c.targetRecipeId)||{});if(!name&&c.targetIngredientId)name=iname(S.ingredients.find(x=>x._id===c.targetIngredientId)||{});let fam=unitFamily(unit),nameCls=sub?'nameSubrecipe':(['INGREDIENT','PREPARATION'].includes(type)?'nameProduct':''),chevCls=sub?'chevSubrecipe':'chevProduct';return `<button class="row" ${click?`data-c="${esc(c._id)}"`:''}><span class="qty"><span>${c.quantity??''}</span>${unit?`<button type="button" class="unitBtn ${fam[0]}" data-unit="${esc(unit)}">${esc(unit)}</button>`:''}</span><span class="name ${nameCls}">${esc(name||'—')}${note?`<span class="note">${esc(note)}</span>`:''}</span><span class="chev ${click?chevCls:''}">${click?'›':''}</span></button>`}
function openComponent(id){let c=S.components.find(x=>x._id===id);if(!c)return;if(isSubrecipe(c)){S.modal={kind:'subrecipe',componentId:id};renderModal();return}if(c.targetIngredientId){S.modal={kind:'ingredient',ingredientId:c.targetIngredientId,prepId:c.targetPreparationId||''};renderModal()}}
function openUnit(unit){S.modal={kind:'unit',unit};renderModal()}
function closeModal(){S.modal=null;renderModal()}
function renderModal(){if(!S.modal){modal.innerHTML='';back.classList.toggle('hidden',!S.route.length);return}back.classList.remove('hidden');if(S.modal.kind==='legend')return renderLegend();if(S.modal.kind==='unit')return renderUnit();if(S.modal.kind==='subrecipe')return renderSubrecipeModal();return renderIngredientModal()}
function shell(title,body){modal.innerHTML=`<div class="modalShade" id="shade"><div class="modal"><div class="modalHead"><h2>${esc(title)}</h2><button id="close" class="icon">×</button></div>${body}</div></div>`;$('#close').onclick=closeModal;$('#shade').onclick=e=>{if(e.target.id==='shade')closeModal()}}
function renderSubrecipeModal(){let c=S.components.find(x=>x._id===S.modal.componentId);if(!c){closeModal();return}let recipe=c.targetRecipeId?S.recipes.find(r=>r._id===c.targetRecipeId):null,name=txt(c,'displayEn','displayEs')||(recipe?rname(recipe):'—'),pending=!recipe;let body=`<span class="tag tagPrep">${esc(t('subrecipe'))}</span><h2 style="margin:4px 0 8px;color:var(--prep)">${esc(name)}</h2><p class="modalText">${esc(pending?t('pending'):(S.lang==='es'?'Esta preparación tiene su propia ficha técnica.':'This preparation has its own technical sheet.'))}</p><div class="modalActions">${recipe?`<button id="openRecipeBtn" class="primary">${esc(t('openRecipe'))}</button>`:''}<button id="modalCloseBtn" class="secondary">${esc(t('close'))}</button></div>`;shell(name,body);$('#modalCloseBtn').onclick=closeModal;if(recipe)$('#openRecipeBtn').onclick=()=>openRecipe(recipe._id)}
function renderIngredientModal(){let ing=S.ingredients.find(x=>x._id===S.modal.ingredientId);if(!ing){closeModal();return}let ps=S.preparations.filter(x=>x.ingredientId===ing._id),sel=ps.find(x=>x._id===S.modal.prepId)||null,bu=img(ing.baseImage),pu=img(sel?.image);let prepPicker=ps.length?`<div class="prepList">${ps.map(p=>`<button class="prep ${sel?._id===p._id?'active':''}" data-p="${esc(p._id)}">${esc(pname(p))}</button>`).join('')}</div>`:'';let photos=`<div class="photos">${photoBlock(t('whole'),iname(ing),bu,'ingredient',ing._id)}${sel?photoBlock(t('cut'),pname(sel),pu,'preparation',sel._id):''}</div>`;shell(iname(ing),prepPicker+photos);modal.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{S.modal.prepId=x.dataset.p;renderModal()});modal.querySelectorAll('[data-photo]').forEach(x=>x.onclick=()=>pickPhoto(x.dataset.type,x.dataset.id))}
function photoBlock(title,name,url,type,id){return `<article class="photo"><div class="pic">${url?`<img src="${esc(url)}">`:`<span class="muted">${esc(t('noPhoto'))}</span>`}</div><div class="photoBody"><h3>${esc(title)}</h3><p>${esc(name)}</p><button class="${url?'secondary':'primary'}" data-photo data-type="${type}" data-id="${esc(id)}">${url?t('replace'):t('add')}</button></div></article>`}
function unitInfo(unit){let fam=unitFamily(unit)[1],es=S.lang==='es';let map={metricMass:es?'Masa métrica. g = gramos; kg = kilogramos. 1 kg = 1000 g.':'Metric mass. g = grams; kg = kilograms. 1 kg = 1000 g.',imperialMass:es?'Masa imperial. oz = onzas; lb = libras. 1 lb = 16 oz.':'Imperial mass. oz = ounces; lb = pounds. 1 lb = 16 oz.',metricVolume:es?'Volumen métrico. ml = mililitros; L = litros. 1 L = 1000 ml.':'Metric volume. ml = milliliters; L = liters. 1 L = 1000 ml.',count:es?'Conteo por pieza o unidad. Se usa cuando el ingrediente se cuenta, no se pesa.':'Piece or unit count. Used when an ingredient is counted rather than weighed.',spoon:es?'Medidas por cuchara. tsp = cucharadita; tbsp = cucharada.':'Spoon measures. tsp = teaspoon; tbsp = tablespoon.',cup:es?'Medida por taza. La equivalencia exacta depende del estándar de la receta.':'Cup measure. Exact equivalence depends on the recipe standard.',other:es?'Unidad especial o cantidad según necesidad. Consulte la indicación de la receta.':'Special unit or quantity as needed. Follow the recipe instruction.'};return map[fam]}
function renderUnit(){let u=S.modal.unit,f=unitFamily(u);shell(`${t('unit')}: ${u}`,`<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><span class="unitBtn ${f[0]}">${esc(u)}</span><strong>${esc(t('unit'))}</strong></div><p class="modalText">${esc(unitInfo(u))}</p>`)}
function renderLegend(){let es=S.lang==='es',rows=[['var(--dish)',t('dish'),es?'Ficha final que se sirve al cliente.':'Final dish served to the guest.'],['var(--prep)',t('prep'),es?'Subreceta o preparación reutilizable.':'Reusable preparation or subrecipe.'],['var(--product)',t('product'),es?'Ingrediente o producto base.':'Base ingredient or product.'],['var(--metricMass)','g / kg',es?'Masa métrica.':'Metric mass.'],['var(--imperialMass)','oz / lb',es?'Masa imperial.':'Imperial mass.'],['var(--metricVolume)','ml / L',es?'Volumen métrico.':'Metric volume.'],['var(--count)','ea / u',es?'Conteo por unidad.':'Count by unit.'],['var(--spoon)','tsp / tbsp',es?'Cucharas.':'Spoon measures.'],['var(--cup)','cup',es?'Tazas.':'Cup measures.']];shell(t('legend'),`<div class="legend">${rows.map(r=>`<div class="legendRow"><span class="swatch" style="background:${r[0]}"></span><div><b>${esc(r[1])}</b><small>${esc(r[2])}</small></div></div>`).join('')}</div>`)}
function pickPhoto(type,id){let input=document.createElement('input');input.type='file';input.accept='image/*';input.capture='environment';input.onchange=()=>{let file=input.files?.[0];if(!file)return;let requestId='up_'+Date.now();S.pending.set(requestId,{file,type,id});toast('…',999999);send('REQUEST_MEDIA_UPLOAD_URL',{requestId,fileName:file.name||'photo.jpg',mimeType:file.type||'image/jpeg',sizeInBytes:file.size,entityType:type,entityId:id})};input.click()}
async function upload(p){let x=S.pending.get(p.requestId);if(!x)return;try{let r=await fetch(p.uploadUrl,{method:'PUT',headers:{'Content-Type':x.file.type||'image/jpeg'},body:x.file});if(!r.ok)throw Error(r.status);let d=await r.json(),f=d.file||{},im=f.media?.image?.image||{};send('SAVE_ENTITY_IMAGE',{requestId:p.requestId,entityType:x.type,entityId:x.id,image:{id:im.id||f.id,url:im.url||f.url,height:im.height||0,width:im.width||0,altText:''}})}catch(e){toast('Error',3000)}}
function saved(p){let x=S.pending.get(p.requestId);S.pending.delete(p.requestId);let type=p.entityType||x?.type,id=p.entityId||x?.id;if(type==='ingredient'){let a=S.ingredients.find(i=>i._id===id);if(a)a.baseImage=p.image}if(type==='preparation'){let a=S.preparations.find(i=>i._id===id);if(a)a.image=p.image}toast('✓',1200);render();if(S.modal)renderModal()}
addEventListener('message',e=>{let m=e.data;if(typeof m==='string')try{m=JSON.parse(m)}catch{return}if(!m?.type)return;let p=m.payload||{};if(m.type==='WIX_READY')send('LOAD_MENU_DATA');if(m.type==='MENU_DATA_LOADED'){Object.assign(S,{recipes:p.recipes||[],sections:p.sections||[],components:p.components||[],ingredients:p.ingredients||[],preparations:p.preparations||[],loaded:true});render()}if(m.type==='MEDIA_UPLOAD_URL')upload(p);if(m.type==='ENTITY_IMAGE_SAVED')saved(p);if(m.type==='ERROR'&&p.message)toast(p.message,3000)});setLang(S.lang);send('MENU_HTML_READY',{version:'2.1.0',adaptiveMobile:true,visualTaxonomy:true});})();
</script>
</body>
</html>
