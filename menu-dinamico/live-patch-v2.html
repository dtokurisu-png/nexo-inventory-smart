<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Menú Dinámico</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#host{display:block;width:100%;height:100dvh;border:0;background:#fff}</style></head><body><iframe id="host" src="./live.html?v=20260903-6" allow="camera" title="Menú Dinámico"></iframe><script>(()=>{'use strict';const host=document.getElementById('host');function inject(){try{const liveDoc=host.contentDocument;if(!liveDoc)return false;const app=liveDoc.getElementById('app');if(!app||!app.contentDocument)return false;const doc=app.contentDocument;if(doc.getElementById('nexo-all-open-card-stripes-v2'))return true;const s=doc.createElement('style');s.id='nexo-all-open-card-stripes-v2';s.textContent=`
/* Opened ingredient modal: every internal card keeps its taxonomy stripe. */
.modal .photos>.photo{position:relative!important;overflow:hidden!important;box-sizing:border-box!important;border-bottom-width:8px!important;border-bottom-style:solid!important}
.modal .photos>.photo:first-child{border-bottom-color:var(--product)!important}
.modal .photos>.photo:nth-child(n+2){border-bottom-color:var(--prep)!important}
/* Product modal generated by taxonomy layer. */
.modal .taxonomyProductBase{border-bottom:8px solid var(--product)!important}
.modal .taxonomyProductPrep{border-bottom:8px solid var(--prep)!important}
/* Recipe detail identity. */
.recipeView.nexoDetailDish .hero{border-bottom:9px solid var(--dish)!important}
.recipeView.nexoDetailPrep .hero{border-bottom:9px solid var(--prep)!important}
@media(max-width:720px){.modal .photos>.photo,.modal .taxonomyProductBase,.modal .taxonomyProductPrep{border-bottom-width:7px!important}.recipeView.nexoDetailDish .hero,.recipeView.nexoDetailPrep .hero{border-bottom-width:7px!important}}
`;doc.head.appendChild(s);return true}catch(_){return false}}function schedule(){let n=0;const t=setInterval(()=>{inject();if(++n>80)clearInterval(t)},100);try{const liveDoc=host.contentDocument;if(liveDoc){new MutationObserver(()=>inject()).observe(liveDoc,{subtree:true,childList:true})}}catch(_){}}host.addEventListener('load',schedule);window.addEventListener('message',e=>{if(e.source===host.contentWindow){parent.postMessage(e.data,'*')}else if(e.source===parent){host.contentWindow.postMessage(e.data,'*')}});})();</script></body></html>
