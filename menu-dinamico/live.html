function openRequestedRecipe(rawId){

  const run=()=>{
    const target=pendingRecipeId;
    if(!target)return;
    attempts++;

      const recipes=Array.isArray(data?.recipes)?data.recipes:[];
      if(!data||!recipes.length){
        if(attempts<120){pendingRecipeTimer=setTimeout(run,100);return}

      }
      const visible=recipes.some(r=>String(r?._id||'')===target);
